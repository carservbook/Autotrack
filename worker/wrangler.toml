name = "autotrack"
main = "index.js"
compatibility_date = "2024-01-01"

[assets]
binding = "ASSETS"
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "car-service-db"
database_id = "16e68f51-7511-4de3-8fef-4e25865320a2"

# ── KV یادآور/ادمین — از این به بعد با دیپلوی پاک نمی‌شود ──
[[kv_namespaces]]
binding = "AUTOTRACK_V27"
id = "066106bb36174d1584b0c1a5aaa34e63"

[vars]
GOOGLE_CLIENT_ID = "20920130213-a2obe464tmk48e92ejgcu4ik5qk8ip9t.apps.googleusercontent.com"

# ── کرن روزانهٔ ۰۹:۰۰ ایران (کرن قدیمی هر-۶-ساعت حذف شد) ──
[triggers]
crons = ["30 5 * * *"]