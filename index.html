<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* [v2.11.1] گیرندهٔ پل مهاجرت — اگر این صفحه با #hb= باز شده باشد (انتقال از
   دامنهٔ قدیمی)، توکن/داده/تنظیمات را در همین دامنه بازیابی می‌کند و بلافاصله
   هش را از نوار آدرس پاک می‌کند (هش هرگز به سرور نمی‌رود). اگر در همین دامنه
   دادهٔ محلیِ «جلوتر» وجود داشته باشد، دادهٔ منتقل‌شده جایگزینش نمی‌شود.
   کاملاً محافظت‌شده: هر خطایی = بوت عادی بدون هیچ اثری. */
(function(){
  try{
    var m=location.hash.match(/^#hb=([A-Za-z0-9\-_]+)$/);
    if(!m) return;
    var p=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
    if(!p||p.v!==1) return;
    /* [v2.11.12] خطای ورود گوگل (برگشت از مسیر back) → toast در بوت اپ */
    if(p.err){ try{ sessionStorage.setItem('carlog:loginError', String(p.err).slice(0,200)); }catch(e1){} history.replaceState(null,'',location.pathname+location.search); return; }
    /* [ترتیب حیاتی] lastModified «قدیمیِ» این دامنه باید قبل از هر بازنویسی
       خوانده شود — وگرنه گاردِ دادهٔ جلوتر همیشه بی‌اثر می‌شود. */
    var curLm=0;
    try{ curLm=parseInt(localStorage.getItem('carlog:lastModified'),10)||0; }catch(e0){}
    if(p.t) localStorage.setItem('carlog:token',p.t);
    if(p.e) localStorage.setItem('carlog:email',p.e);
    if(p.vf) localStorage.setItem('carlog:verified',p.vf);
    /* مُهر زمانی فقط «جلو» می‌رود — اگر این دامنه خودش جلوتر است، هرگز کهنه نمی‌شود */
    if(p.lm && (parseInt(p.lm,10)||0)>curLm) localStorage.setItem('carlog:lastModified',String(p.lm));
    if(p.ls && (parseInt(p.ls,10)||0)>curLm) localStorage.setItem('carlog:lastSyncAt',String(p.ls));
    if(p.as) localStorage.setItem('carlog:accountStamp',String(p.as));
    if(p.la) localStorage.setItem('carlog:lastAccount',String(p.la));
    if(p.d && curLm<=(parseInt(p.lm,10)||0)) localStorage.setItem('carlog:v2',p.d);
    if(p.s){
      if(p.s.th) localStorage.setItem('carlog:theme',String(p.s.th));
      if(p.s.rm) localStorage.setItem('carlog:reminders',String(p.s.rm));
      if(p.s.cp) localStorage.setItem('carlog:costPeriod',String(p.s.cp));
      if(p.s.ts) localStorage.setItem('carlog:tourSeen',String(p.s.ts));
    }
    localStorage.setItem('carlog:handoffToast','1');
    localStorage.setItem('carlog:migratedAt',String(Date.now()));
    history.replaceState(null,'',location.pathname+location.search);
  }catch(e){}
})();
</script>
<script>
/* [v2.11.12] برداشت نشست پس از بازگشت OAuth — داخل TWA رقص گوگل در Custom Tab
   (خارج از scope) انجام می‌شود؛ وقتی کاربر آن را می‌بندد و به اپ برمی‌گردد، اگر
   توکن تازه با #hb= رسیده باشد، صفحه یک‌بار تازه‌سازی می‌شود تا بدون تلاش دوم
   وارد شود. فقط ۱۰ دقیقهٔ اول بعد از بارگذاری فعال است. */
(function(){
  try{
    if(localStorage.getItem('carlog:token')&&localStorage.getItem('carlog:email')) return;
    var v2112t0=Date.now();
    document.addEventListener('visibilitychange',function(){
      try{
        if(document.visibilityState!=='visible') return;
        if(Date.now()-v2112t0>600000) return;
        if(localStorage.getItem('carlog:token')&&localStorage.getItem('carlog:email')) location.reload();
      }catch(e){}
    });
  }catch(e){}
})();
</script>
<script>
/* [v2.11.1] پل مهاجرت نرم — این صفحه روی دامنهٔ قدیمی باز شده است: بعد از تأیید
   دسترس‌پذیری دامنهٔ اصلی (تا کاربرِ آفلاین هرگز به صفحهٔ خطای مرورگر نرود)،
   توکن و دادهٔ محلی و تنظیمات با #hb= به دامنهٔ اصلی منتقل می‌شود؛ کاربر بدون
   لاگین مجدد و بدون از دست دادن هیچ چیزی جابه‌جا می‌شود. اگر دامنهٔ اصلی در
   دسترس نبود، اپ قدیمی همان‌جا به کار عادی ادامه می‌دهد (تلاش دوباره در بازشدن
   بعدی). دادهٔ محلیِ دامنهٔ قدیمی پاک نمی‌شود (شبکهٔ ایمنی + امکان برگشت).
   localhost/127.0.0.1/file:// برای تست محلی مستثنا هستند. */
(function(){
  try{
    window.__ghGoMain=go; /* [v2.11.11] برای دکمهٔ «بازگشت به اپ اصلی» — تعریف تابع hoisted است */
    var h=location.hostname;
    if(h==='api.carservbook.ir'||h==='localhost'||h==='127.0.0.1'||h==='') return;
    /* [v2.11.3] گیت کاربران نصب‌کرده — قلب راهکار «بدون لطمه»:
       اپِ نصب‌شده (TWA کافه بازار یا PWA روی صفحهٔ اصلی) فقط برای دامنهٔ مبدأِ خودش
       fullscreen است؛ اگر همین صفحه به api.carservbook.ir پرش کند، خارج از scope
       می‌شود و اندروید/کروم آن را در نمای مرورگر با «نوار آدرس» بالا نشان می‌دهد.
       پس کاربر نصب‌کرده اصلاً منتقل نمی‌شود — اپش روی همین دامنه سرو می‌شود که
       الان هم کاملاً کار می‌کند (API از هر سه دامنه در دسترس است). مهاجرت فقط
       برای کاربر مرورگر است که به هر حال آدرس را می‌بیند. سیگنال‌های نصب:
       ۱) display-mode: standalone/minimal-ui (PWA نصب‌شده + TWA)
       ۲) navigator.standalone===true (PWA نصب‌شده روی iOS/Safari)
       ۳) referrer شروع‌شده با android-app: (صفحهٔ باز‌شده داخل TWA) */
    try{
      var installed=false;
      try{ installed=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: minimal-ui)').matches; }catch(e1){}
      if(!installed && typeof navigator!=='undefined' && navigator.standalone===true) installed=true;
      if(!installed && typeof document!=='undefined' && typeof document.referrer==='string' && document.referrer.indexOf('android-app:')===0) installed=true;
      if(installed) return;
    }catch(e0){}
    var dst='https://api.carservbook.ir';
    var finished=false;
    var ghWent=false; /* [v2.11.11] گارد مستقل برگشت — finished فقط پنجرهٔ خودکار را می‌بندد */
    function go(){
      if(ghWent) return; ghWent=true;
      var p={v:1};
      try{ var tk=localStorage.getItem('carlog:token'); if(tk) p.t=tk; }catch(e){}
      try{ var em=localStorage.getItem('carlog:email'); if(em) p.e=em; }catch(e){}
      try{ var vf=localStorage.getItem('carlog:verified'); if(vf) p.vf=vf; }catch(e){}
      try{ var lm=localStorage.getItem('carlog:lastModified'); if(lm) p.lm=lm; }catch(e){}
      try{ var ls=localStorage.getItem('carlog:lastSyncAt'); if(ls) p.ls=ls; }catch(e){}
      try{ var ac=localStorage.getItem('carlog:accountStamp'); if(ac) p.as=ac; }catch(e){}
      try{ var la=localStorage.getItem('carlog:lastAccount'); if(la) p.la=la; }catch(e){}
      try{ var dd=localStorage.getItem('carlog:v2'); if(dd&&dd.length<=30000) p.d=dd; }catch(e){}
      var s={};
      try{ var th=localStorage.getItem('carlog:theme'); if(th) s.th=th; }catch(e){}
      try{ var rm=localStorage.getItem('carlog:reminders'); if(rm) s.rm=rm; }catch(e){}
      try{ var cp=localStorage.getItem('carlog:costPeriod'); if(cp) s.cp=cp; }catch(e){}
      try{ var ts=localStorage.getItem('carlog:tourSeen'); if(ts) s.ts=ts; }catch(e){}
      if(s.th||s.rm||s.cp||s.ts) p.s=s;
      var frag='';
      try{ frag=btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }catch(e2){}
      location.replace(dst+(frag?('#hb='+frag):''));
    }
    /* [v2.11.11] گیت سلامتِ واقعی API — قبلاً version.json با no-cors صدا زده می‌شد؛
       اما سرویس‌ورکر اپ اصلی استاتیک‌های same-origin را cache-first جواب می‌دهد، پس این
       پینگ روی دستگاهِ نصب‌کرده از «کش دیسک» سبز می‌شد و پل فکر می‌کرد سرور سالم است،
       در حالی که API از شبکه واقعاً جواب نمی‌داد (پرش به اپ اصلی بدون همگام‌سازی).
       حالا: POST /api/ping با mode:'cors' روی هر دو مسیر — /api/* هرگز کش نمی‌شود
       (پچ B-01) و فقط پاسخ 200+{"ok":true}یِ واقعی معتبر است؛ وگرنه همین‌جا می‌مانیم. */
    try{
      var ghClosed=false, ghPending=2;
      function ghSettle(okFlag){
        if(ghClosed || finished) return; /* پنجرهٔ برگشت خودکار بسته = فقط دستی */
        if(okFlag){ ghClosed=true; go(); return; }
        ghPending--;
        if(ghPending<=0){ ghClosed=true; finished=true; ghStayNote(); }
      }
      function ghStayNote(){
        /* حالت ماندن: سرور واقعاً در دسترس نیست — نشانگر کوچک + بازگشت دستی */
        try{
          if(document.getElementById('ghOfflinePill')) return;
          var p=document.createElement('div');
          p.id='ghOfflinePill';
          var bot='10px';
          try{ if(document.getElementById('ghBackupBanner')) bot='86px'; }catch(e){}
          p.style.cssText='position:fixed;left:10px;right:10px;bottom:calc('+bot+' + env(safe-area-inset-bottom,0px));z-index:2147483000;background:#382a10;color:#ffd58a;border:1px solid #7a5c1e;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.9;text-align:center;font-family:inherit';
          p.innerHTML='سرور اصلی فعلاً در دسترس نیست — نسخهٔ پشتیبان باز مانده است. <button id="ghPillGo" style="background:#2e7d43;color:#fff;border:0;border-radius:8px;padding:5px 12px;font-size:12px;font-family:inherit;margin-inline-start:6px">بازگشت به اپ اصلی</button>';
          (document.body||document.documentElement).appendChild(p);
          var b=document.getElementById('ghPillGo');
          if(b) b.onclick=function(){ try{ if(window.__ghGoMain) window.__ghGoMain(); else location.href='https://api.carservbook.ir/'; }catch(e){} };
        }catch(e){}
      }
      function ghPing(base){
        var c=new AbortController();
        var t=setTimeout(function(){ try{ c.abort(); }catch(e){} },4000);
        return fetch(base+'/api/ping',{method:'POST',mode:'cors',cache:'no-store',signal:c.signal})
          .then(function(r){ if(!r || !r.ok) throw new Error('http '+r.status); return r.json(); })
          .then(function(j){ if(!j || j.ok!==true) throw new Error('bad-body'); clearTimeout(t); return true; })
          .catch(function(){ clearTimeout(t); return false; });
      }
      ghPing(dst).then(ghSettle);
      ghPing('https://autotrack.carservbook.ir').then(ghSettle);
    }catch(e3){ finished=true; return; }
    setTimeout(function(){ finished=true; ghStayNote(); },6000);
  }catch(e){}
})();
</script>

}
.summary .pill b{display:block; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
.summary .pill span{font-size:10.5px; color:var(--dim);}
.summary .pill.danger b{color:var(--danger);}
.summary .pill.warn b{color:var(--warn);}
.summary .pill.ok b{color:var(--ok);}
.summary .pill.clickable{cursor:pointer;}
.summary .pill.clickable:active{background:var(--card-hi);}

/* ---------- Car info read-only view ---------- */
.info-list{display:flex; flex-direction:column;}
.info-row{display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px dashed var(--border); gap:10px;}
.info-row:last-child{border-bottom:none;}
.info-label{font-size:12.5px; color:var(--dim); flex-shrink:0;}
.info-val{font-size:13.5px; color:var(--text); font-weight:600; text-align:left; direction:ltr; word-break:break-all;}

/* ---------- Doc cards (insurance / inspection) ---------- */
.doc-cards{display:flex; flex-direction:column; gap:8px;}
.doc-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px;}
.doc-card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.doc-card-title{font-size:13px; font-weight:700;}
.doc-card-row{font-size:12px; color:var(--dim); margin-top:4px; display:flex; justify-content:space-between; gap:8px;}
.doc-card-row b{color:var(--text); font-weight:600;}
.doc-card-expiry{color:var(--dim); font-size:11px; flex-shrink:0; white-space:nowrap;}

/* ---------- Status drilldown list ---------- */
.status-list{display:flex; flex-direction:column; gap:2px; max-height:50vh; overflow-y:auto;}
.status-item{display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer;}
.status-item:last-child{border-bottom:none;}
.status-item-name{font-size:13.5px; font-weight:700;}
.status-item-meta{font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums;}

/* ---------- Cost / photo in history ---------- */
.hist-total{font-size:12px; color:var(--accent); font-weight:700; padding:8px 2px; border-bottom:1px solid var(--border); margin-bottom:4px;}
.hist-item-main{display:flex; align-items:center; gap:8px;}
.hist-thumb{width:32px; height:32px; border-radius:8px; object-fit:cover; flex-shrink:0; cursor:pointer; border:1px solid var(--border);}
.photo-thumb-preview img, .photo-thumb-preview{margin-top:8px;}
.photo-thumb-preview img{width:70px; height:70px; object-fit:cover; border-radius:10px; border:1px solid var(--border);}
.photo-full{width:100%; border-radius:12px; margin-top:10px;}
.field input[type=file]{
  width:100%; background:var(--card); border:1px solid var(--border); color:var(--dim);
  border-radius:12px; padding:10px; font-size:12px; font-family:inherit;
}

/* ---------- Quick-add chips ---------- */
.quick-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.chip{
  background:var(--bg2); border:1px solid var(--border); color:var(--dim);
  border-radius:20px; padding:7px 13px; font-size:11.5px; font-family:inherit; cursor:pointer;
}
.chip:active{background:var(--card-hi); color:var(--text);}

/* ---------- Print report (hidden on screen, shown when printing) ---------- */
#printReport{display:none;}
@media print{
  body *{visibility:hidden;}
  #printReport, #printReport *{visibility:visible;}
  #printReport{
    display:block; position:absolute; top:0; right:0; width:100%;
    direction:rtl; background:#fff; color:#111; padding:20px; font-family:'Vazirmatn',sans-serif;
  }
  .report-header{border-bottom:2px solid #111; padding-bottom:12px; margin-bottom:16px;}
  .report-header h1{font-size:20px; margin:0 0 6px;}
  .report-sub{font-size:14px; font-weight:700; margin-bottom:6px;}
  .report-plate{font-size:12px; margin-bottom:4px;}
  .report-meta{font-size:11px; color:#333; margin-bottom:3px;}
  .report-service{margin-bottom:16px; page-break-inside:avoid;}
  .report-service-title{font-size:13px; font-weight:700; margin-bottom:6px; border-bottom:1px solid #ccc; padding-bottom:4px;}
  .report-note{font-weight:400; color:#555; font-size:11px;}
  .report-table{width:100%; border-collapse:collapse; font-size:11px;}
  .report-table th, .report-table td{border:1px solid #ccc; padding:5px 8px; text-align:center;}
  .report-table th{background:#eee;}
  .report-total{margin-top:14px; font-size:14px; font-weight:700; text-align:left;}
}

/* ---------- Notif banner ---------- */
.notif-banner{
  margin-top:12px; padding:12px 14px; border-radius:14px;
  background:var(--warn-dim); border:1px solid #6b5324;
  display:flex; align-items:center; gap:10px; font-size:12.5px; color:#f0d9ad;
  cursor:pointer;
}
.notif-banner svg{flex-shrink:0;}

/* ---------- Home screen v2 (glowing neon-blue skin) ---------- */
.iconbtn.glow{
  background:linear-gradient(135deg, #2f6bff, #6a3df5);
  border:none; color:#fff;
  box-shadow:0 0 16px rgba(66,110,255,.55), inset 0 1px 0 rgba(255,255,255,.15);
}
.iconbtn.glow:active{filter:brightness(.9);}

.odo-panel-v2{
  display:flex; align-items:stretch; margin-top:10px;
  background:linear-gradient(160deg, #131a35 0%, #0d1226 100%);
  border:1px solid #232c52; border-radius:16px; padding:10px 10px;
  box-shadow:0 8px 24px -10px rgba(43,80,220,.35);
}
.odo-col{flex:1; display:flex; align-items:center; gap:9px; padding:2px 6px; cursor:pointer;}
.odo-icon-chip{
  width:36px; height:36px; border-radius:11px; flex-shrink:0;
  background:linear-gradient(135deg, #2f6bff, #6a3df5);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 12px rgba(66,110,255,.5);
}
.odo-icon-chip svg{width:17px; height:17px;}
.odo-col-text{display:flex; flex-direction:column; gap:2px; min-width:0;}
.odo-col-label{font-size:10.5px; color:var(--dim);}
.odo-col-value{font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text); white-space:nowrap;}
.odo-col-value .unit{font-size:10px; color:var(--dim); font-weight:600;}
.odo-divider{width:1px; background:#232c52; margin:2px 4px;}

.search-row-v2{position:relative; margin-top:9px;}
.search-row-v2 input{
  width:100%; background:linear-gradient(160deg, #131a35 0%, #0d1226 100%);
  border:1px solid #232c52; color:var(--text);
  border-radius:22px; padding:10px 40px 10px 14px; font-family:inherit; font-size:12.5px;
}
.search-row-v2 input:focus{outline:none; border-color:#4a6bff;}
.search-row-v2 .search-icon{position:absolute; top:50%; right:15px; transform:translateY(-50%); color:var(--dim2); pointer-events:none;}

.health-bar-wrap-v2{margin-top:11px; padding:0 3px;}
.health-bar-label-v2{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
.health-bar-label-v2 b{font-size:13px; font-variant-numeric:tabular-nums;}
.health-bar-label-v2 span{font-size:10.5px; color:var(--dim); font-weight:600;}
.health-bar-fill-v2{height:100%; border-radius:5px; background:linear-gradient(90deg, #f2a541, #f7d94c); transition:width .3s;}

.summary-v2{display:flex; gap:6px; margin-top:8px;}
.pillcard{
  flex:1; position:relative; border-radius:11px; padding:7px 5px 6px;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:0;
  border:1px solid; overflow:hidden;
}
.pillcard.ok{background:linear-gradient(160deg, rgba(34,197,94,.16), rgba(15,22,20,.4)); border-color:rgba(34,197,94,.35);}
.pillcard.warn{background:linear-gradient(160deg, rgba(234,179,8,.18), rgba(28,22,10,.4)); border-color:rgba(234,179,8,.35);}
.pillcard.danger{background:linear-gradient(160deg, rgba(239,68,68,.18), rgba(30,14,14,.4)); border-color:rgba(239,68,68,.35);}
.pillcard-icon{
  width:21px; height:21px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  margin-bottom:2px;
}
.pillcard-icon svg{width:10px; height:10px;}
.pillcard.ok .pillcard-icon{background:#22c55e; color:#0d1a10; box-shadow:0 0 8px rgba(34,197,94,.5);}
.pillcard.warn .pillcard-icon{background:#eab308; box-shadow:0 0 8px rgba(234,179,8,.5);}
.pillcard.danger .pillcard-icon{background:#ef4444; box-shadow:0 0 8px rgba(239,68,68,.5);}
.pillcard b{font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text); line-height:1.25;}
.pillcard-label{font-size:9.5px; font-weight:700; color:var(--text); line-height:1.3;}
.pillcard-sub{font-size:7px; color:var(--dim); line-height:1.3;}
.pillcard-chev{position:absolute; top:5px; right:6px; color:var(--dim2); font-size:9px;}
.pillcard.clickable{cursor:pointer;}
.pillcard.clickable:active{filter:brightness(1.15);}

/* ---------- Main hamburger menu ---------- */
.menu-list{display:flex; flex-direction:column; gap:2px;}
.menu-row{
  display:flex; align-items:center; gap:12px; padding:13px 4px;
  border-bottom:1px solid var(--border); cursor:pointer;
}
.menu-row:last-child{border-bottom:none;}
.menu-row:active{background:var(--card-hi);}
.menu-row-icon{
  width:34px; height:34px; border-radius:10px; background:var(--bg2);
  display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0;
}
.menu-row span:not(.menu-row-chev){flex:1; font-size:13.5px; font-weight:600;}
.menu-row-chev{color:var(--dim2); font-size:14px;}

/* ---------- Health bar ---------- */
.health-bar-wrap{margin-top:12px;}
.health-bar-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--dim); margin-bottom:5px;}
.health-bar-label b{font-variant-numeric:tabular-nums; font-size:13px;}
.health-bar-track{height:7px; border-radius:5px; background:var(--bg2); overflow:hidden;}
.health-bar-fill{height:100%; border-radius:5px; transition:width .3s;}

/* ---------- Search ---------- */
.search-row{position:relative; margin-top:12px;}
.search-row input{
  width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
  border-radius:12px; padding:11px 38px 11px 14px; font-family:inherit; font-size:13px;
}
.search-row input:focus{outline:none; border-color:var(--accent);}
.search-row .search-icon{position:absolute; top:50%; right:12px; transform:translateY(-50%); color:var(--dim2); pointer-events:none;}

/* ---------- Category groups ---------- */
.cat-group{margin-bottom:6px;}
.cat-header{
  display:flex; align-items:center; justify-content:space-between; padding:12px 4px 8px;
  cursor:pointer;
}
.cat-header-title{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--text);}
.cat-header-title svg{color:var(--accent);}
.cat-count{font-size:11px; color:var(--dim); font-weight:600; background:var(--bg2); border-radius:20px; padding:2px 8px;}
.cat-header-right{display:flex; align-items:center; gap:6px;}
.cat-dot{width:7px; height:7px; border-radius:50%;}
.cat-dot.danger{background:var(--danger);}
.cat-dot.warn{background:var(--warn);}
.cat-chev{display:inline-block; color:var(--dim); transition:transform .2s; transform:rotate(-90deg);}
.cat-chev.collapsed{transform:rotate(90deg);}

.carinfo-row{
  margin-top:10px; padding:10px 14px; border-radius:12px;
  background:var(--bg2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  font-size:12px; color:var(--dim); cursor:pointer;
}
.carinfo-row .chev{transform:rotate(180deg); color:var(--dim2);}

/* ---------- Car switcher ---------- */
.car-list{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
.car-row{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:6px;
}
.car-row.active{border-color:var(--accent);}
.car-row-main{flex:1; display:flex; align-items:center; gap:10px; padding:8px 6px; cursor:pointer; min-width:0;}
.car-check{width:22px; height:22px; border-radius:50%; background:var(--accent); color:#241a08; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
/* [v2.11.6] فیکس بیضی‌شدن دایرهٔ خالی انتخاب ماشین: کلاس عمومی .empty (بلوک «هنوز کاری ثبت نشده»)
   padding:50px 20px دارد و چون span دایره کلاس‌های «car-check empty» را با هم دارد، همان padding
   روی دایره هم اعمال می‌شد → جعبهٔ 43×103 با border-radius:50% = بیضی بزرگ. padding:0 با
   specificity بالاتر (0,2,0) آن را خنثی می‌کند تا دایرهٔ خالی دقیقاً هم‌اندازهٔ دایرهٔ نارنجی تیک‌دار باشد. */
.car-check.empty{background:transparent; border:1.5px solid var(--border); padding:0;}
.car-row-plate{font-size:14px; font-weight:700;}
.car-row-sub{font-size:11px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.car-row-edit{
  width:36px; height:36px; border-radius:10px; background:var(--bg2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; color:var(--dim); flex-shrink:0; cursor:pointer;
}

/* ---------- Section headers ---------- */
.section-title{
  font-size:12.5px; color:var(--dim); font-weight:700; margin:22px 4px 10px;
  display:flex; align-items:center; justify-content:space-between;
}

/* ---------- Cards ---------- */
.cards{display:flex; flex-direction:column; gap:10px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; display:flex; gap:12px; align-items:center;
  position:relative;
}
.card.due{border-color:#5c2b27;}
.card.due-warn{border-color:#5c4a1f;}
.card.due-ok{border-color:#1f4a30;}
.card-icon{
  display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
  border-radius:7px; background:var(--bg2); color:var(--accent); margin-left:8px; flex-shrink:0;
}
.card-title{display:flex; align-items:center;}
.gauge-wrap{width:64px; flex-shrink:0; display:flex; flex-direction:column; align-items:center;}
.gauge-wrap svg{width:64px; height:38px; display:block;}
.gauge-pct{font-size:11px; font-weight:700; margin-top:-14px; font-variant-numeric:tabular-nums;}
.card-body{flex:1; min-width:0;}
.card-title-row{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.card-title{font-size:14.5px; font-weight:700;}
.badge{
  font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;
}
.badge.danger{background:var(--danger-dim); color:#ff8f88;}
.badge.warn{background:var(--warn-dim); color:#f5c37a;}
.badge.ok{background:var(--ok-dim); color:#7fe0ac;}
.badge.neutral{background:var(--neutral-dim); color:var(--dim);}
.card-meta{font-size:11.5px; color:var(--dim); margin-top:5px; line-height:1.7;}
.card-meta b{color:#c7cbd1; font-weight:600; font-variant-numeric:tabular-nums;}
.card-actions{display:flex; gap:6px; margin-top:10px;}
.btn{
  border:none; border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700;
  cursor:pointer; font-family:inherit;
}
.btn.primary{background:var(--accent); color:#241a08;}
.btn.primary.syncing{background:var(--neutral-dim); color:var(--dim); cursor:default;}
.btn.primary.synced{background:var(--ok); color:#0d1f14;}
.btn.primary.synced svg{vertical-align:-3px; margin-left:5px;}
.btn.ghost{background:var(--bg2); color:var(--dim); border:1px solid var(--border);}
.btn:active{filter:brightness(.9);}

.empty{
  text-align:center; padding:50px 20px; color:var(--dim); font-size:13px;
}

/* ---------- Onboarding (no cars yet) ---------- */
.onboarding{
  min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:30px 24px;
}
.onboarding-icon{
  width:64px; height:64px; border-radius:20px; background:var(--card); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; color:var(--accent); margin-bottom:18px;
}
.onboarding-icon svg{width:30px; height:30px;}
.onboarding h2{font-size:17px; margin:0 0 8px;}
.onboarding p.sub{max-width:280px; margin-bottom:20px;}

/* ---------- FAB (centered circle on taskbar) ---------- */
.fab-center{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:64px; height:64px; border-radius:50%;
  background:var(--accent); color:#241a08; border:3px solid var(--bg);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px -4px rgba(242,165,65,.6);
  z-index:31; cursor:pointer;
}
.fab-center:active{transform:translateX(-50%) scale(.93);}
.fab-center svg{width:24px; height:24px;}

/* ---------- Bottom taskbar ---------- */
.taskbar{
  position:fixed; bottom:0; left:0; right:0; z-index:25; height:54px;
  background:var(--bg2); border-top:1px solid var(--border);
  display:flex; align-items:center;
  padding:0 4px calc(0px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);
}
.taskbar-group{flex:1; display:flex;}
.taskbar-spacer{width:64px; flex-shrink:0;}
.taskbar-item{
  flex:1; background:none; border:none; color:var(--dim);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 2px; font-family:inherit; cursor:pointer; border-radius:10px;
}
.taskbar-item:active{background:var(--card-hi); color:var(--text);}
.taskbar-item span{font-size:10px; font-weight:600;}

/* ---------- Annual KM view ---------- */
.annual-km-hero{
  text-align:center; padding:22px 10px; background:linear-gradient(155deg, var(--card) 0%, var(--bg2) 100%);
  border:1px solid var(--border); border-radius:16px;
}
.annual-km-hero b{display:block; font-size:34px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums;}
.annual-km-hero span{font-size:12px; color:var(--dim); margin-top:4px; display:block;}

/* ---------- Yearly km breakdown ---------- */
.yearly-list{display:flex; flex-direction:column; gap:10px;}
.yearly-row-top{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; margin-bottom:5px;}
.yearly-row-top span{color:var(--dim); font-weight:600;}
.yearly-row-top b{font-variant-numeric:tabular-nums; color:var(--text);}
.yearly-partial{color:var(--accent); font-size:10.5px;}
.yearly-bar-track{height:9px; border-radius:6px; background:var(--bg2); overflow:hidden;}
.yearly-bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg, var(--accent-dim), var(--accent));}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,10,12,.72); backdrop-filter:blur(2px);
  z-index:100; display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .18s;
}
.modal-overlay.open{opacity:1; pointer-events:auto;}
.modal{
  background:var(--bg2); border:1px solid var(--border); border-radius:22px 22px 0 0;
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(20px); transition:transform .18s;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal h2{font-size:16px; margin:0 0 4px; font-weight:800;}
.modal p.sub{font-size:12px; color:var(--dim); margin:0 0 16px;}
.handle{width:36px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 14px;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--dim); margin-bottom:6px; font-weight:600;}
.field input[type=text], .field input[type=number], .field input[type=password], .field input[type=email], .field select{
  width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
  border-radius:12px; padding:12px 12px; font-size:14px; font-family:inherit; font-variant-numeric:tabular-nums;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
.date-row{display:flex; gap:8px;}
.date-row input{text-align:center;}
.date-row input.yy{flex:1.3;}
.date-row input.mm, .date-row input.dd{flex:1;}
.row2{display:flex; gap:10px;}
.row2 .field{flex:1;}
.seg{display:flex; gap:6px; background:var(--card); padding:4px; border-radius:12px; border:1px solid var(--border);}
.seg button{
  flex:1; padding:9px 6px; border:none; border-radius:9px; background:transparent; color:var(--dim);
  font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
}
.seg button.active{background:var(--accent); color:#241a08;}
.modal-actions{display:flex; gap:8px; margin-top:6px;}
.modal-actions .btn{flex:1; padding:12px; font-size:13.5px;}
.danger-link{color:var(--danger); font-size:12px; text-align:center; margin-top:16px; cursor:pointer; font-weight:600;}
.auth-error{color:var(--danger); font-size:12px; margin:-4px 0 12px; min-height:14px;}
.google-btn{
  width:100%; background:#fff; color:#1f1f1f; border:1px solid #dadce0;
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:12px; font-weight:700; font-size:13.5px;
}
.or-divider{display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--dim2); font-size:11px;}

/* ---------- Jalali <-> Gregorian (public-domain algorithm) ---------- */
function div(a,b){return Math.trunc(a/b);}
function g2j(gy,gm,gd){
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979;
  gy-= (gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+div(gy2+3,4)-div(gy2+99,100)+div(gy2+399,400)-80+gd+g_d_m[gm-1];
  jy+=33*div(days,12053);
  days%=12053;
  jy+=4*div(days,1461);
  days%=1461;
  if(days>365){jy+=div(days-1,365); days=(days-1)%365;}
  var jm=(days<186)?1+div(days,31):7+div(days-186,30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function j2g(jy,jm,jd){
  var gy=(jy<=979)?621:1600;
  jy-=(jy<=979)?0:979;
  var days=(365*jy)+(div(jy,33)*8)+div(((jy%33)+3),4)+78+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  gy+=400*div(days,146097);
  days%=146097;
  if(days>36524){
    gy+=100*div(days-1,36524);
    days%=36524;
    if(days>=365) days++;
  }
  gy+=4*div(days,1461);
  days%=1461;
  if(days>365){gy+=div(days-1,365); days=(days-1)%365;}
  var gd=days+1;
  var isLeap=((gy%4===0)&&(gy%100!==0))||(gy%400===0);
  var sal_a=[0,31,isLeap?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm=0;
  for(gm=1; gm<13; gm++){ if(gd<=sal_a[gm]) break; gd-=sal_a[gm]; }
  return [gy,gm,gd];
}
function jalaliToJSDate(jy,jm,jd){
  var g=j2g(jy,jm,jd);
  return new Date(g[0],g[1]-1,g[2]);
}
function todayJalali(){
  var now=new Date();
  var g=g2j(now.getFullYear(), now.getMonth()+1, now.getDate());
  return {jy:g[0], jm:g[1], jd:g[2]};
}
function parseJalaliStr(s){
  if(!s) return null;
  var p=String(s).trim().split(/[\/\-]/).map(function(x){return parseInt(toEnglishDigits(x),10);});
  if(p.length!==3||p.some(isNaN)) return null;
  return {jy:p[0], jm:p[1], jd:p[2]};
}
function jalaliStr(j){
  return j.jy+'/'+pad2(j.jm)+'/'+pad2(j.jd);
}
function pad2(n){ n=parseInt(n,10); return (n<10?'0':'')+n; }
function jalaliKey(j){ return j.jy*10000+j.jm*100+j.jd; }
function daysBetweenJalali(j1,j2){
  var d1=jalaliToJSDate(j1.jy,j1.jm,j1.jd);
  var d2=jalaliToJSDate(j2.jy,j2.jm,j2.jd);
  return Math.round((d2-d1)/86400000);
}
var FA_DIGITS=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(n){
  return String(n).replace(/[0-9]/g, function(d){return FA_DIGITS[+d];});
}
function toEnglishDigits(s){
  return String(s).replace(/[۰-۹]/g, function(d){return FA_DIGITS.indexOf(d);})
                   .replace(/[٠-٩]/g, function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);});
}
function faNum(n){ return toFa(Number(n).toLocaleString('en-US')); }
function normalizeFa(s){
  return String(s||'').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').trim().toLowerCase();
}

   به‌محض اتصال موفق داده به یک حساب (پول یا پوش) ثبت می‌شود و با خروج/تعویض حساب،
   اگر با حسابِ جدید نخواند، داده‌ی محلی پاک می‌شود تا داده‌ی یک حساب هرگز به حساب دیگر منتقل نشود. */
var ACCOUNT_STAMP_KEY='carlog:accountStamp';
function getAccountStamp(){ try{ return localStorage.getItem(ACCOUNT_STAMP_KEY); }catch(e){ return null; } }
function setAccountStamp(email){ try{ if(email) localStorage.setItem(ACCOUNT_STAMP_KEY, email); }catch(e){} }
function wipeLocalUserData(){
  /* پاک‌سازی کامل داده‌ی کاربر از دستگاه — بدون saveState تا «lastModified» تازه‌نویسی نشود؛
     حذفِ LAST_MODIFIED_KEY حیاتی است: با ورود مجدد، lastModified محلی=0 < سرور →
     داده از سرور برمی‌گردد و هرگز داده‌ی سرور با نسخه‌ی خالی محلی بازنویسی نمی‌شود.
     تنظیمات دستگاه (تم، تور) عمداً حفظ می‌شود. */
  try{
    localStorage.removeItem(STORE_KEY);
    localStorage.removeItem(OLD_STORE_KEY);
    localStorage.removeItem(LAST_MODIFIED_KEY);
    localStorage.removeItem(ACCOUNT_STAMP_KEY);
    localStorage.removeItem(LAST_SYNC_KEY);
    localStorage.removeItem('carlog:pushSubscribed');
  }catch(e){}
  STATE=buildInitialState();
}
function enforceAccountBinding(){

  try{
    var stamp=getAccountStamp();
    var cur=getAuthEmail();
    if(!stamp && cur){ setAccountStamp(cur); }
    else if(stamp && cur && stamp!==cur){ wipeLocalUserData(); }
  }catch(e){}
}
function loadState(){
  try{
    var raw=localStorage.getItem(STORE_KEY);

  }catch(e){}

}

  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(STATE));

}
var uidCounter=1;
function uid(prefix){ return (prefix||'id')+(Date.now().toString(36))+(uidCounter++); }

/* ---------- Fresh / empty initial state (no personal seed data shipped) ---------- */
function buildInitialState(){
  return { cars: [], activeCarId: null };
}

function migrateOldState(){
  try{
    var raw=localStorage.getItem(OLD_STORE_KEY);
    if(!raw) return null;
    var old=JSON.parse(raw);
    if(!old || !old.services) return null;
    var car={
      id: uid('c'),
      name:'خودرو ۱', model:'', plate:'', engineNumber:'', vin:'', year:'', note:'',
      currentOdo: old.currentOdo||0,
      services: old.services||[],
      mileageLog: old.mileageLog||[],
      notified: old.notified||{}
    };
    return { cars:[car], activeCarId: car.id };
  }catch(e){ return null; }
}

var STATE = loadState() || migrateOldState() || buildInitialState();
if(!STATE.cars){ STATE.cars=[]; }
STATE.cars.forEach(function(c){ if(!c.notified) c.notified={}; if(!c.mileageLog) c.mileageLog=[]; if(c.currentOdo==null) c.currentOdo=0; });
if(STATE.cars.length && (!STATE.activeCarId || !STATE.cars.some(function(c){return c.id===STATE.activeCarId;}))){
  STATE.activeCarId=STATE.cars[0].id;
}
if(!STATE.cars.length){ STATE.activeCarId=null; }
localStorage.setItem(STORE_KEY, JSON.stringify(STATE));

function activeCar(){
  if(!STATE.cars.length) return null;
  return STATE.cars.find(function(c){return c.id===STATE.activeCarId;}) || STATE.cars[0];
}
function findCar(id){ return STATE.cars.find(function(c){return c.id===id;}); }

/* ---------- Rate estimate (km/day) using ALL known odometer data points ---------- */
function collectOdoPoints(car){
  var points=[];
  (car.mileageLog||[]).forEach(function(m){
    var j=parseJalaliStr(m.date);
    if(j && m.odometer!=null) points.push({j:j, odo:m.odometer});
  });
  car.services.forEach(function(s){
    s.history.forEach(function(h){
      if(h.odometer!=null){
        var j=parseJalaliStr(h.date);
        if(j) points.push({j:j, odo:h.odometer});
      }
    });
  });
  if(car.currentOdo!=null){
    points.push({j:todayJalali(), odo:car.currentOdo});
  }
  points.sort(function(a,b){ return jalaliKey(a.j)-jalaliKey(b.j); });
  return points;
}
function estimateRateKmPerDay(car){
  var points=collectOdoPoints(car);
  if(points.length<2) return null;
  var first=points[0];
  var last=points[points.length-1];
  var totalDays=daysBetweenJalali(first.j,last.j);
  if(totalDays<30) return null;
  // Simple linear regression (least squares) over day-offset vs odometer, more robust than endpoints alone
  var n=points.length, sumX=0,sumY=0,sumXY=0,sumXX=0;
  points.forEach(function(p){
    var x=daysBetweenJalali(first.j,p.j);
    var y=p.odo;
    sumX+=x; sumY+=y; sumXY+=x*y; sumXX+=x*x;
  });
  var denom=(n*sumXX - sumX*sumX);
  var slope;
  if(denom===0){ slope=(last.odo-first.odo)/totalDays; }
  else { slope=(n*sumXY - sumX*sumY)/denom; }
  if(slope<=0) return null;
  return {rate:slope, pointCount:n, firstDate:first.j, lastDate:last.j, totalDays:totalDays};
}
function estimateAnnualKm(car){
  var est=estimateRateKmPerDay(car);
  if(!est) return null;
  return Math.round(est.rate*365/100)*100;
}

/* ---------- Year-by-year odometer interpolation ---------- */
function odoAtDate(points, jDate){
  if(!points.length) return null;
  if(points.length===1) return points[0].odo;
  var x=daysBetweenJalali(points[0].j, jDate);
  for(var i=0;i<points.length-1;i++){
    var x1=daysBetweenJalali(points[0].j, points[i].j);
    var x2=daysBetweenJalali(points[0].j, points[i+1].j);
    if(x>=x1 && x<=x2){
      if(x2===x1) return points[i].odo;
      var t=(x-x1)/(x2-x1);
      return points[i].odo + t*(points[i+1].odo-points[i].odo);
    }
  }
  if(x<0){
    var x2b=daysBetweenJalali(points[0].j, points[1].j);
    var slopeB=(points[1].odo-points[0].odo)/(x2b||1);
    return points[0].odo + slopeB*x;
  } else {
    var n=points.length;
    var xA=daysBetweenJalali(points[0].j, points[n-2].j);
    var xB=daysBetweenJalali(points[0].j, points[n-1].j);
    var slopeE=(points[n-1].odo-points[n-2].odo)/((xB-xA)||1);
    return points[n-1].odo + slopeE*(x-xB);
  }
}
function yearlyKmBreakdown(car){
  var points=collectOdoPoints(car);
  if(points.length<2) return [];
  var totalDays=daysBetweenJalali(points[0].j, points[points.length-1].j);
  if(totalDays<30) return [];
  var firstYear=points[0].j.jy;
  var today=todayJalali();
  var lastYear=Math.max(points[points.length-1].j.jy, today.jy);
  var rows=[];
  for(var y=firstYear; y<=lastYear; y++){
    var startOdo=odoAtDate(points, {jy:y, jm:1, jd:1});
    var km, partial=false;
    if(y===today.jy){
      var endOdo=odoAtDate(points, today);
      km=Math.round(endOdo-startOdo);
      partial=true;
    } else {
      var endOdo2=odoAtDate(points, {jy:y+1, jm:1, jd:1});
      km=Math.round(endOdo2-startOdo);
    }
    if(km<0) km=0;
    rows.push({year:y, km:km, partial:partial});
  }
  return rows.reverse();
}

/* ---------- Domain logic ---------- */
function lastEntry(service){
  if(!service.history.length) return null;
  return service.history[service.history.length-1];
}
function computeStatus(service, car){
  var last=lastEntry(service);
  var today=todayJalali();
  var result={ percent:null, status:'neutral', nextKm:null, nextDateEst:null, daysLeft:null, kmLeft:null };
  if(!last){ return result; }
  var lastJ=parseJalaliStr(last.date);
  var pctKm=null, pctDay=null;

  if(service.intervalKm && last.odometer!=null){
    result.nextKm = last.odometer + service.intervalKm;
    result.kmLeft = result.nextKm - car.currentOdo;
    pctKm = (car.currentOdo - last.odometer) / service.intervalKm;
  }
  if(service.intervalDays){
    var elapsed = daysBetweenJalali(lastJ, today);
    result.daysLeft = service.intervalDays - elapsed;
    pctDay = elapsed / service.intervalDays;
  }
  var pcts=[pctKm,pctDay].filter(function(p){return p!=null;});
  if(pcts.length){
    result.percent = Math.max.apply(null, pcts);
    if(result.percent>=1) result.status='danger';
    else if(result.percent>=0.85) result.status='warn';
    else result.status='ok';
  }
  if(service.intervalKm && !service.intervalDays && result.kmLeft!=null && result.kmLeft>0){
    var est=estimateRateKmPerDay(car);
    if(est){
      var daysAhead = Math.round(result.kmLeft / est.rate);
      var gEst = jalaliToJSDate(today.jy,today.jm,today.jd);
      gEst.setDate(gEst.getDate()+daysAhead);
      var jEst = g2j(gEst.getFullYear(), gEst.getMonth()+1, gEst.getDate());
      result.nextDateEst = jalaliStr({jy:jEst[0],jm:jEst[1],jd:jEst[2]});
    }
  }
  return result;
}

/* ---------- Notifications (checks every car) ---------- */
function checkAndNotify(){
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  var cfg=getRemSettings();
  var today=todayJalali(); var todayKey=jalaliKey(today);
  var quiet=inQuietHours();
  STATE.cars.forEach(function(car){
    car.services.forEach(function(s){
      var st=computeStatus(s, car);
      var due=(st.status==='danger');
      var near=(st.status==='warn');
      if(!due && !(cfg.warnNotify && near)) return;
      if(quiet && !due) return; /* ساعات سکوت: نزدیک‌ها بعد از سکوت اعلام می‌شوند (علامت نمی‌خورند) */
      var notifyKey=car.id+':'+s.id;
      var lastNotified = car.notified[s.id];
      if(lastNotified===todayKey) return;
      var carName = plateHasParts(car) ? (toEnglishDigits(car.plateN1)+car.plateLetter+toEnglishDigits(car.plateN2)) : car.name;
      var title = due ? 'موعد سرویس رسیده 🔧' : 'سرویس به موعد نزدیکه ⏳';
      var body = carName+' — '+s.name+' — '+(due ? 'وقتش رسیده، انجامش بده' : duePhrase(st));
      try{ new Notification(title, { body: body, tag: notifyKey }); }catch(e){}
      car.notified[s.id]=todayKey;
      saveState();
    });
  });
}

function renderCardsSection(){
  var car=activeCar();
  var svc = car.services.map(function(s){ return {s:s, st:computeStatus(s, car)}; });
  var q=normalizeFa(SEARCH_QUERY);
  if(q){ svc=svc.filter(function(x){ return normalizeFa(x.s.name).indexOf(q)>-1; }); }

  var order={danger:0,warn:1,ok:2,neutral:3};

  var groups={};
  svc.forEach(function(x){
    var cat=categorizeService(x.s.name);
    if(!groups[cat.key]) groups[cat.key]={def:cat, items:[]};
    groups[cat.key].items.push(x);
  });

  var html='';
  html+='<div class="section-title">کارهای '+escapeHtml(car.name||'این خودرو')+' ('+faNum(svc.length)+')</div>';

  if(!svc.length){
    html+='<div class="empty">'+(SEARCH_QUERY?'چیزی با این اسم پیدا نشد.':'هنوز کاری برای این خودرو ثبت نشده. با دکمه پایین یکی اضافه کن.')+'</div>';
  } else {
    CATEGORY_DEFS.forEach(function(catDef){
      var g=groups[catDef.key];
      if(!g || !g.items.length) return;
      g.items.sort(function(a,b){ return order[a.st.status]-order[b.st.status]; });
      var collapsed=!!COLLAPSED_CATS[catDef.key];
      var catCounts={danger:0,warn:0};
      g.items.forEach(function(x){ if(catCounts[x.st.status]!=null) catCounts[x.st.status]++; });
      html+='<div class="cat-group">';
      html+='  <div class="cat-header" onclick="toggleCategory(\''+catDef.key+'\')">';
      html+='    <span class="cat-header-title">'+categoryIconSVG(catDef.icon)+escapeHtml(catDef.label)+'<span class="cat-count">'+faNum(g.items.length)+'</span></span>';
      html+='    <span class="cat-header-right">';
      if(catCounts.danger) html+='<span class="cat-dot danger"></span>';
      if(catCounts.warn) html+='<span class="cat-dot warn"></span>';
      html+='<span class="cat-chev '+(collapsed?'collapsed':'')+'">‹</span>';
      html+='    </span>';
      html+='  </div>';
      if(!collapsed){
        html+='  <div class="cards">';
        g.items.forEach(function(x){ html+=renderCard(x.s,x.st,catDef.icon); });
        html+='  </div>';
      }
      html+='</div>';
    });
  }

  document.getElementById('cardsSection').innerHTML=html;
}

function renderCard(s, st, iconKey){
  var last=lastEntry(s);
  var meta='';
  if(s.note){
    meta+='<span style="color:var(--accent)">'+escapeHtml(s.note)+'</span><br>';
  }
  if(last){
    meta+='آخرین بار: <b>'+toFa(last.date)+'</b>'+(last.odometer!=null?' — <b>'+faNum(last.odometer)+'</b> کیلومتر':'');
  } else {
    meta+='هنوز انجام نشده';
  }
  if(s.intervalKm){
    meta+='<br>هر <b>'+faNum(s.intervalKm)+'</b> کیلومتر';
    if(st.kmLeft!=null){
      meta+= st.kmLeft>=0 ? (' — <b>'+faNum(st.kmLeft)+'</b> کیلومتر مونده') : (' — <b>'+faNum(Math.abs(st.kmLeft))+'</b> کیلومتر گذشته');
    }
    if(st.nextDateEst){
      meta+='<br>تخمین تاریخ: <b>'+toFa(st.nextDateEst)+'</b>';
    }
  }
  if(s.intervalDays){
    meta+='<br>هر <b>'+faNum(s.intervalDays)+'</b> روز';
    if(st.daysLeft!=null){
      meta+= st.daysLeft>=0 ? (' — <b>'+faNum(st.daysLeft)+'</b> روز مونده') : (' — <b>'+faNum(Math.abs(st.daysLeft))+'</b> روز گذشته');
    }
  }
  if(!s.intervalKm && !s.intervalDays){
    meta+='<br><span style="color:var(--dim2)">یادآور تنظیم نشده</span>';
  }

  var pctLabel = st.percent!=null ? faNum(Math.round(Math.min(1,Math.max(0,st.percent))*100))+'٪' : '—';
  var borderCls = st.status==='danger'?'due':(st.status==='warn'?'due-warn':(st.status==='ok'?'due-ok':''));

  return ''
    +'<div class="card '+borderCls+'">'
    +'  <div class="gauge-wrap">'+gaugeSVG(st.percent, st.status)+'<div class="gauge-pct">'+pctLabel+'</div></div>'
    +'  <div class="card-body">'
    +'    <div class="card-title-row">'
    +'      <div class="card-title"><span class="card-icon">'+categoryIconSVG(iconKey)+'</span>'+escapeHtml(s.name)+'</div>'
    +'      <div class="badge '+st.status+'">'+statusLabel(st.status)+'</div>'
    +'    </div>'
    +'    <div class="card-meta">'+meta+'</div>'
    +'    <div class="card-actions">'
    +'      <button class="btn primary" onclick="openLogModal(\''+s.id+'\')">ثبت انجام</button>'
    +'      <button class="btn ghost" onclick="openEditModal(\''+s.id+'\')">ویرایش</button>'
    +'    </div>'
    +'  </div>'
    +'</div>';
}

function escapeHtml(str){
  /* [S-03 fix] escape کامل شامل گیومه — دیگر breakout از داخل value="..." ممکن نیست.
     نسخه قبلی (innerText/innerHTML) کوتیشن را escape نمی‌کرد و ورودی مثل:
     " onfocus="alert(1)  می‌توانست از فیلد پلاک/نام/یادداشت به attribute تزریق شود. */
  return String(str==null?'':str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

/* ---------- Modal helpers ---------- */
var MODAL_HISTORY_PUSHED=false;
function openModal(html){
  var wasOpen=overlayEl.classList.contains('open');
  modalEl.innerHTML='<div class="handle"></div>'+html;
  overlayEl.classList.add('open');
  if(!wasOpen && !MODAL_HISTORY_PUSHED){
    try{ history.pushState({modal:true}, ''); MODAL_HISTORY_PUSHED=true; }catch(e){}
  }
}
function closeModal(fromPopstate){
  overlayEl.classList.remove('open');
  if(MODAL_HISTORY_PUSHED){
    MODAL_HISTORY_PUSHED=false;
    if(!fromPopstate){
      try{ history.back(); }catch(e){}
    }
  }
}

if(typeof window!=='undefined' && window.addEventListener){
  window.addEventListener('popstate', function(){
    if(overlayEl.classList.contains('open')){
      closeModal(true);
    }
  });
}

function lastCostHint(s){
  try{
    var hc=(s.history||[]).filter(function(x){return x.cost>0;});
    if(hc.length) return 'مثل دفعه قبل: '+faNum(hc[hc.length-1].cost);
  }catch(e){}
  return 'مثلا 850000';
}
function resizeImageFile(file, maxDim, quality, cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      var canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.src=e.target.result;
  };

function saveLog(serviceId){
  var car=activeCar();
  var s=car.services.find(function(x){return x.id===serviceId;});
  if(!s) return;
  var jy=parseInt(toEnglishDigits(document.getElementById('lY').value),10);
  var jm=parseInt(toEnglishDigits(document.getElementById('lM').value),10);
  var jd=parseInt(toEnglishDigits(document.getElementById('lD').value),10);
  var odo=parseInt(toEnglishDigits(document.getElementById('lOdo').value),10);
  var costRaw=document.getElementById('lCost').value.trim();
  var cost=costRaw?parseInt(toEnglishDigits(costRaw),10):null;
  if(!jy||!jm||!jd){ toast('تاریخ معتبر نیست'); return; }
  var entry={date: jalaliStr({jy:jy,jm:jm,jd:jd}), odometer: isNaN(odo)?null:odo, cost:(cost&&!isNaN(cost))?cost:null, photo: window._pendingPhoto||null};
  s.history.push(entry);
  s.history.sort(function(a,b){return jalaliKey(parseJalaliStr(a.date))-jalaliKey(parseJalaliStr(b.date));});
  if(!isNaN(odo) && odo>car.currentOdo) car.currentOdo=odo;
  delete car.notified[s.id];
  window._pendingPhoto=null;
  try{
    saveState();
  }catch(e){
    toast('حجم عکس زیاده، بدون عکس ذخیره شد');
    entry.photo=null;
    saveState();
  }
  closeModal(); renderApp(); toast('ثبت شد ✓');
}

function saveService(serviceId){
  var car=activeCar();
  var name=document.getElementById('eName').value.trim();
  var km=parseInt(toEnglishDigits(document.getElementById('eKm').value),10);
  var days=parseInt(toEnglishDigits(document.getElementById('eDays').value),10);
  var note=document.getElementById('eNote').value.trim();
  if(!name){ toast('اسم کار رو وارد کن'); return; }
  if(!serviceId){
    var iy=parseInt(toEnglishDigits(document.getElementById('eIY').value),10);
    var im=parseInt(toEnglishDigits(document.getElementById('eIM').value),10);
    var id_=parseInt(toEnglishDigits(document.getElementById('eID').value),10);
    var iOdo=parseInt(toEnglishDigits(document.getElementById('eIOdo').value),10);
    var initDate = (iy&&im&&id_) ? jalaliStr({jy:iy,jm:im,jd:id_}) : jalaliStr(todayJalali());
    var s={
      id: uid('s'), name:name,
      intervalKm: isNaN(km)?null:km,
      intervalDays: isNaN(days)?null:days,
      note:note,
      history:[{date: initDate, odometer: isNaN(iOdo)?null:iOdo, cost:null, photo:null}]
    };
    car.services.push(s);
    toast('کار اضافه شد ✓');
  } else {
    var s=car.services.find(function(x){return x.id===serviceId;});
    s.name=name;
    s.intervalKm=isNaN(km)?null:km;
    s.intervalDays=isNaN(days)?null:days;
    s.note=note;
    toast('ذخیره شد ✓');
  }
  saveState(); closeModal(); renderApp();
}
function deleteService(serviceId){
  if(!confirm('این کار حذف بشه؟')) return;
  var car=activeCar();
  car.services=car.services.filter(function(x){return x.id!==serviceId;});
  saveState(); closeModal(); renderApp(); toast('حذف شد');
}
function deleteHistEntry(serviceId, idx){
  var s=activeCar().services.find(function(x){return x.id===serviceId;});

}

/* ---------- Car info (read-only view) ---------- */
function computeExpiryDate(service){
  var last=lastEntry(service);
  if(!last || !service.intervalDays) return null;
  var lastJ=parseJalaliStr(last.date);
  if(!lastJ) return null;
  var g=jalaliToJSDate(lastJ.jy,lastJ.jm,lastJ.jd);
  g.setDate(g.getDate()+service.intervalDays);
  var j=g2j(g.getFullYear(), g.getMonth()+1, g.getDate());
  return jalaliStr({jy:j[0],jm:j[1],jd:j[2]});
}
/* ---------- Annual KM estimate view ---------- */
function openAnnualKmView(carId){
  var c=findCar(carId);
  if(!c) return;
  var est=estimateRateKmPerDay(c);
  var html='<h2>کارکرد سالانه (تخمینی)</h2>';
  if(!est){
    html+='<p class="sub">هنوز داده‌ی کافی برای تخمین نیست. وقتی چند بار در طول زمان (حداقل با فاصله‌ی یک ماه) کیلومتر یا کارها رو ثبت کنی، اینجا یه تخمین دقیق‌تر نشون داده میشه.</p>';
    html+='<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">بستن</button></div>';
    openModal(html);
    return;
  }
  var annual=Math.round(est.rate*365/100)*100;
  var monthly=Math.round(est.rate*30/10)*10;
  html+='<div class="annual-km-hero"><b>'+faNum(annual)+'</b><span>کیلومتر تخمینی در سال (میانگین کل)</span></div>';

  var yearly=yearlyKmBreakdown(c);
  if(yearly.length){
    var maxKm=Math.max.apply(null, yearly.map(function(r){return r.km;}));
    html+='<div class="section-title" style="margin:18px 4px 8px">کارکرد سال‌به‌سال</div>';
    html+='<div class="yearly-list">';
    yearly.forEach(function(r){
      var pct = maxKm>0 ? Math.round((r.km/maxKm)*100) : 0;
      html+='<div class="yearly-row">';
      html+='  <div class="yearly-row-top"><span>'+toFa(r.year)+(r.partial?' <span class="yearly-partial">(تا الان)</span>':'')+'</span><b>'+faNum(r.km)+' کیلومتر</b></div>';
      html+='  <div class="yearly-bar-track"><div class="yearly-bar-fill" style="width:'+pct+'%"></div></div>';
      html+='</div>';
    });
    html+='</div>';
  }

/* ---------- PDF report via browser print ---------- */
function printCarReport(carId){
  var c=findCar(carId);
  if(!c) return;
  var today=todayJalali();
  var totalCost=0;
  var html='<div class="report-header">';
  html+='<h1>گزارش سرویس خودرو</h1>';
  html+='<div class="report-sub">'+escapeHtml([c.name,c.model].filter(Boolean).join(' — '))+'</div>';
  if(plateHasParts(c)){
    html+='<div class="report-plate">پلاک: '+toFa(c.plateN1)+' '+escapeHtml(c.plateLetter)+' '+toFa(c.plateN2)+' — ایران '+toFa(c.plateRegion)+'</div>';
  }
  html+='<div class="report-meta">';
  if(c.year) html+='سال ساخت: '+toFa(c.year)+' &nbsp;|&nbsp; ';
  if(c.engineNumber) html+='شماره موتور: '+toFa(c.engineNumber)+' &nbsp;|&nbsp; ';
  if(c.vin) html+='VIN: '+toFa(c.vin);
  html+='</div>';
  html+='<div class="report-meta">کیلومتر فعلی: '+faNum(c.currentOdo)+' — تاریخ گزارش: '+toFa(jalaliStr(today))+'</div>';
  html+='</div>';

  var servicesWithHistory = c.services.filter(function(s){ return s.history.length>0; });
  servicesWithHistory.forEach(function(s){
    html+='<div class="report-service">';
    html+='<div class="report-service-title">'+escapeHtml(s.name)+(s.note?' <span class="report-note">('+escapeHtml(s.note)+')</span>':'')+'</div>';
    html+='<table class="report-table"><thead><tr><th>تاریخ</th><th>کیلومتر</th><th>هزینه (تومان)</th></tr></thead><tbody>';
    s.history.slice().reverse().forEach(function(h){
      if(h.cost) totalCost+=h.cost;
      html+='<tr><td>'+toFa(h.date)+'</td><td>'+(h.odometer!=null?faNum(h.odometer):'—')+'</td><td>'+(h.cost?faNum(h.cost):'—')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  });

  if(totalCost>0){
    html+='<div class="report-total">مجموع کل هزینه‌های ثبت‌شده: '+faNum(totalCost)+' تومان</div>';
  }
  if(!servicesWithHistory.length){
    html+='<p>هنوز هیچ کاری برای این خودرو ثبت نشده.</p>';
  }

  document.getElementById('printReport').innerHTML = html;
  closeModal();
  setTimeout(function(){ window.print(); }, 150);
}

      engineNumber:engineNumber, vin:vin, year:year, note:note,

function deleteCar(carId){

  STATE.cars=STATE.cars.filter(function(c){return c.id!==carId;});
  /* [v2.11.13] حذفِ آگاهانهٔ آخرین خودرو → پوش خالی بعدی با confirmWipe مجاز می‌شود
     (گارد سرور empty-wipe-guard بدون این مُهر، پوش خالی را با 409 رد می‌کند) */
  if(!STATE.cars.length){ try{ WIPE_CONFIRM_AT=Date.now(); }catch(e){} }
  if(STATE.activeCarId===carId){
    STATE.activeCarId = STATE.cars.length ? STATE.cars[0].id : null;
  }
  saveState(); closeModal(); renderApp(); toast('حذف شد');
}

function setAuth(token,email){
  /* [L-02 fix v2.6.3] گارد تعویض حساب — همگام و قبل از هر چیز:
     اگر داده‌ی محلی قبلاً به حساب دیگری وصل بوده (یا آخرین حسابِ واردشده دیگری است

     جدید منتقل (پوش) نشود — مهم حتی برای مسیر ورود با گوگل و منقضی‌شدن توکن. */
  try{

var API_BASE='https://api.carservbook.ir'; /* [v2.10.0] دامنهٔ واحد API — جداسازی شِل از API */
/* [v2.11.8] فیلاور API — مسیر پشتیبان: زیردامنهٔ autotrack.carservbook.ir (همان ورکر، همان داده، همان توکن).
   چرا: گاهی مسیر «اپ ← api.carservbook.ir» موقتاً پاسخ نمی‌دهد (فیلترینگِ موقتِ هاست‌نیم، اختلال لحظه‌ایِ
   مسیر ایران→کلودفلر، DNS اپراتور) در حالی که مسیر دوم روی همان ورکر باز است. قواعدِ کم‌ریسک:
   • فقط خطای شبکه/تایم‌اوت فیلاور می‌سازد؛ هر پاسخ HTTP (حتی 5xx/401) یعنی مسیر اصلی زنده است — فیلاور نمی‌کنیم.
   • بعد از یک فیلاور موفق، تا ۱۰دقیقه مسیر پشتیبان ارجح است (carlog:apiFailover) تا هر تماس معطلِ
     تایم‌اوتِ مسیر اصلی نماند.
   • بعد از ۱۰دقیقه دوباره مسیر اصلی امتحان می‌شود؛ اگر جواب داد رکورد پاک می‌شود (خودترمیم به مسیر اصلی).
   • رفتار مسیر سالم دقیقاً مثل قبل است؛ کاربر عادی هیچ تفاوتی حس نمی‌کند. ورود گوگل/ناوبری‌ها تغییر نمی‌کند. */
var API_FALLBACK_BASE='https://autotrack.carservbook.ir';
var API_FAILOVER_KEY='carlog:apiFailover';
var API_FAILOVER_COOLDOWN_MS=10*60*1000;
function apiFailoverState(){
  try{ var raw=localStorage.getItem(API_FAILOVER_KEY); if(!raw) return null; var st=JSON.parse(raw); return (st && st.base)?st:null; }catch(e){ return null; }
}
function apiFailoverPreferFallback(){
  var st=apiFailoverState();
  return !!(st && st.base==='fallback' && (Date.now()-(st.at||0))<API_FAILOVER_COOLDOWN_MS);
}
function apiFailoverRecord(base){
  try{ localStorage.setItem(API_FAILOVER_KEY, JSON.stringify({base:base, at:Date.now()})); }catch(e){}
}
function apiFailoverClear(){
  try{ localStorage.removeItem(API_FAILOVER_KEY); }catch(e){}
}
/* [v2.11.5] سقف زمانی برای همهٔ تماس‌های API — دیگر هیچ درخواستی بی‌نهایت معطل نمی‌ماند.
   ریشهٔ «کلی معطلی»: fetch بدون AbortController روی شبکهٔ کند/نیمه‌مرده دقیقه‌ها آویزان می‌ماند
   و کاربر هیچ بازخوردی نمی‌گیرد. حالا بعد از ۲۰ ثانیه درخواست رها می‌شود و خطای TYPEدار
   («TIMEOUT») پرتاب می‌شود تا تماس‌گیرنده‌ها بتوانند پیام درست نشان دهند. */
var API_TIMEOUT_MS=20000;
/* [v2.11.8] یک تلاشِ تک‌مقصدی — همان منطق قبلی apiFetch؛ فقط «base» پارامتر شد و هر تلاش
   AbortController تازه می‌گیرد تا تایم‌اوتِ مسیر اول، مسیر دوم را هم نکشد. */
function apiFetchVia(base, path, opts){
  var o={};
  for(var k in opts){ if(k!=='signal') o[k]=opts[k]; }
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var aborted=false;
  if(ctrl){
    try{
      o.signal=ctrl.signal;
      setTimeout(function(){ aborted=true; try{ ctrl.abort(); }catch(e0){} }, opts.timeoutMs||API_TIMEOUT_MS);
    }catch(eC){ ctrl=null; }
  }
  return fetch(base+path, o).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(data){
      return {ok:r.ok, status:r.status, data:data, via:base};
    });
  })['catch'](function(err){
    if(aborted || (err && (err.name==='AbortError' || err.name==='TimeoutError'))){ throw new Error('TIMEOUT'); }
    throw err;
  });
}
function apiFetch(path, opts){
  opts=opts||{};
  opts.headers=opts.headers||{};
  opts.headers['Content-Type']='application/json';
  var token=getAuthToken();
  if(token) opts.headers['Authorization']='Bearer '+token;
  /* [v2.11.8] انتخاب مسیر اول/دوم + فیلاور فقط روی خطای شبکه (TIMEOUT/TypeError) */
  var first=apiFailoverPreferFallback()?API_FALLBACK_BASE:API_BASE;
  var second=(first===API_BASE)?API_FALLBACK_BASE:API_BASE;
  /* [v2.11.14] فیل‌اور سریع برای GET — تایم‌اوت تلاش اول ۸ثانیه (به‌جای ۲۰) تا روی شبکه‌های
     ناسازگار، معطلِ مسیر مرده نمانیم؛ تلاش دوم ۱۵ثانیه. POSTها (نوشتن) مثل قبل ۲۰ثانیه. */
  var isGet=(!opts.method || opts.method==='GET');
  var firstOpts=opts;
  if(isGet){ firstOpts={}; for(var fk in opts){ firstOpts[fk]=opts[fk]; } firstOpts.timeoutMs=8000; }
  return apiFetchVia(first, path, firstOpts)['catch'](function(err1){
    var netErr=!!(err1 && (err1.message==='TIMEOUT' || err1.name==='TypeError' || err1.name==='AbortError' || err1.name==='TimeoutError'));
    if(!netErr) throw err1;
    try{ console.warn('[v2.11.8] مسیر اصلی API در دسترس نبود؛ تلاش با مسیر پشتیبان:', second); }catch(e0){}
    var secondOpts=opts;
    if(isGet){ secondOpts={}; for(var sk in opts){ secondOpts[sk]=opts[sk]; } secondOpts.timeoutMs=15000; }
    return apiFetchVia(second, path, secondOpts);
  }).then(function(res){
    /* [v2.11.8] خودترمیم: هر موفقیت مسیرِ برنده را ثبت/تازه می‌کند؛ موفقیت مسیر اصلی رکورد فیلاور را پاک می‌کند */
    if(res && res.via===API_FALLBACK_BASE){ apiFailoverRecord('fallback'); }
    else if(res && res.via===API_BASE && apiFailoverState()){ apiFailoverClear(); }
    return res;
  });
}

/* ---------- [v2.11.15] پیش‌پرواز API — مسابقهٔ سریع دو مسیر ----------
   (v2.11.15: پروب به GET /version.json با mode:'no-cors' رفت — سبک‌تر از POST /api/ping:
   بدون بدنه و بدون وابستگی به CORS؛ هر پاسخی یعنی «مسیر زنده» و فقط تایم‌اوت/خطای شبکه
   یعنی «مرده». توجه: GET /api/ping در مرورگر 404 می‌دهد چون آن مسیر فقط POST را می‌پذیرد
   — برای تست مرورگری از /version.json استفاده کنید.)
   در بوت / برگشت اینترنت / برگشت به اپ، هر دو مسیر همزمان با سقف ۴ثانیه پینگ می‌شوند
   و مسیر برنده چسبنده می‌شود (مکانیزم فیلاور موجود) — نتیجه: اولین همگام‌سازی هر
   نشست دیگر معطل تایم‌اوتِ مسیرِ کند نمی‌ماند. کول‌داون ۶۰ثانیه؛ شکست هر دو = بی‌طرف. */
var API_PREFLIGHT_INFLIGHT=false, API_PREFLIGHT_LAST=0;
function apiPreflight(){
  try{
    if(API_PREFLIGHT_INFLIGHT || typeof fetch==='undefined') return;
    var now=Date.now();
    if(API_PREFLIGHT_LAST && (now-API_PREFLIGHT_LAST)<60000) return;
    API_PREFLIGHT_LAST=now; API_PREFLIGHT_INFLIGHT=true;
    var done=0, winner=null;
    function fin(base){
      done++;
      if(base && !winner) winner=base;
      if(done<2) return;
      API_PREFLIGHT_INFLIGHT=false;
      if(winner===API_FALLBACK_BASE){ apiFailoverRecord('fallback'); }
      else if(winner===API_BASE){ apiFailoverClear(); }
    }
    [API_BASE, API_FALLBACK_BASE].forEach(function(base){
      var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
      var timer=setTimeout(function(){ try{ if(ctrl) ctrl.abort(); }catch(e1){} }, 4000);
      /* [v2.11.15] پروب روی /version.json — هر پاسخی (حتی opaque با no-cors) یعنی مسیر
         زنده است؛ فقط تایم‌اوت/خطای شبکه یعنی مرده. ?_t= ضدکش. */
      fetch(base+'/version.json?_t='+Date.now(), {cache:'no-store', mode:'no-cors', signal:ctrl?ctrl.signal:undefined})
        .then(function(r){ clearTimeout(timer); fin(base); })
        ['catch'](function(){ clearTimeout(timer); fin(null); });
    });
  }catch(e0){ try{ API_PREFLIGHT_INFLIGHT=false; }catch(e1){} }
}

var SYNC_TIMER=null;
var WIPE_CONFIRM_AT=0; /* [v2.11.13] مُهر «حذف آگاهانهٔ آخرین خودرو» — فقط ۱۵ دقیقه اعتبار دارد */

/* [v2.11.5] doCloudPush دیگر هرگز بی‌صدا نیست — ریشهٔ «هیچ اتفاقی نمی‌افته»:
   نسخهٔ قبلی خطاها را با catch(function(){}) قورت می‌داد و کاربر هیچ‌چیز نمی‌دید.

function doCloudPush(allowEmpty, showOk){

     فقط مسیرهای صریح (انتخابِ آگاهانهٔ کاربر در مودال تعارض) با allowEmpty=true مجازند. */
  if(!allowEmpty && !(STATE && STATE.cars && STATE.cars.length)){
    try{ console.warn('[S-07] doCloudPush blocked: local state is empty (auto-push guard)'); }catch(e){}
    return Promise.resolve(false);
  }
  /* [v2.11.7] چیپ «در حال همگام‌سازی» فقط اگر عملیات بیش از ۱.۲ثانیه طول بکشد —
     موفقیت‌های سریع دیگر فلاشِ چیپ نمی‌سازند */

     پوش خالی با confirmWipe همراه می‌شود تا گارد سرور (empty-wipe-guard) ردش نکند */
  var pushBody={data: STATE};

       این یعنی حالت خالی محلی عمدی نیست؛ خودترمیمی: بکش از سرور، بدون چیپ قرمز و outbox */
    if(res.status===409 && res.data && res.data.needConfirm){

         بی‌پایان: بستن نشست + پیام روشن؛ همان مسیرِ 401 در همگام‌سازی دستی */
      clearBusyChip();

      try{ renderApp(); }catch(e3){}

      toast('نشست حساب تمام شده — دوباره وارد حساب شو');
      return false;
    }
    if(res.ok && res.data && res.data.updatedAt){
      try{ localStorage.setItem(LAST_MODIFIED_KEY, String(res.data.updatedAt)); }catch(e){}
      /* [L-02 fix v2.6.3] داده الان رسماً به این حساب چسبید — مُهر بزن */
      setAccountStamp(getAuthEmail());
      setLastSyncAt(); /* [S-04 fix v2.6.4] نشانگر «آخرین همگام‌سازی موفق» برای پروفایل */
      clearLastSyncErr(); /* [v2.11.15] خطای قبلی حل شد — پاکش کن */
      PENDING_OUTBOX=false;
      try{ clearTimeout(OUTBOX_RETRY_TIMER); }catch(e1){}
      /* [v2.11.7] موفقیت = ریستِ کامل سیاست آرام */
      clearBusyChip();
      try{ clearTimeout(SYNC_ERR_HIDE_TIMER); }catch(e2){}
      SYNC_FAIL_STREAK=0; SYNC_RETRY_DELAY=SYNC_RETRY_BASE;

      else{ syncChip(null); }

    }
    /* [v2.11.7] پاسخ غیرمنتظرهٔ سرور — از سیاست چیپ آرام می‌گذرد (اولین خطای هر دوره بی‌صدا)

function flushSyncOnHide(){
  if(!getAuthToken() || typeof navigator==='undefined' || !navigator.sendBeacon) return;
  if(!(STATE && STATE.cars && STATE.cars.length)) return; /* [S-07 fix v2.6.7] بیکانِ حالتِ خالی هنگام بستنِ صفحه = پاک‌کردنِ سرور — ممنوع */
  clearTimeout(SYNC_TIMER);
  try{
    var payload=JSON.stringify({token:getAuthToken(), data: STATE});
    var blob=new Blob([payload], {type:'application/json'});
    navigator.sendBeacon('/api/data-beacon', blob);
  }catch(e){}
}

/* ---------- [v2.11.5] موتور اطمینان همگام‌سازی — چیپ وضعیت + صندوق ارسال مجدد + مقایسهٔ معنایی ----------
   سه ریشهٔ تجربهٔ بد «همگام‌سازی به‌سختی / هیچ اتفاقی نمی‌افته / مودال تعارضِ تکراری»:
   ۱) پوش‌های شکست‌خورده بی‌صدا گم می‌شدند → الان PENDING_OUTBOX + تلاش مجدد خودکار
   ۲) هیچ بازخوردی نبود → الان چیپ وضعیت sync همیشه وضعیت واقعی را نشان می‌دهد
   ۳) مقایسهٔ خام JSON (ترتیب کلید/فلگ‌های اعلان هر دستگاه) تعارضِ کاذب می‌ساخت →
      الان مقایسهٔ معنایی با کلیدهای مرتب‌شده و نادیده‌گرفتن فلگ notified */
var PENDING_OUTBOX=false, OUTBOX_RETRY_TIMER=null, LAST_RECONCILE=0;
var RECONCILE_COOLDOWN_MS=60000;
/* [v2.11.7] چیپ آرام + بک‌آف نمایی — کندیِ لحظه‌ای شبکه (مثلاً مسیر ایران→کلودفلر) نباید
   کاربر را بترساند یا نگرانِ داده‌اش کند:
   • شکستِ اولِ هر دوره: کاملاً بی‌صدا (اپ خودش دوباره تلاش می‌کند — داده هرگز گم نمی‌شود)
   • از شکست دوم: چیپ کهرباییِ ملایم با پیام اطمینان‌بخش؛ بعد از ۸ثانیه خودش جمع می‌شود
   • فقط بعد از ۴ شکستِ پشت‌سرهم: چیپ قرمزِ ماندگار با تضمین «داده‌ها محفوظ‌اند» (لمس = تلاش فوری)
   • اپ در پس‌زمینه (document.hidden): هیچ چیپی اصلاً نشان داده نمی‌شود
   • بک‌آف تلاش مجدد: ۳۰ثانیه → ۱دقیقه → ۲دقیقه → ۴دقیقه → سقف ۸دقیقه؛ با هر موفقیت ریست */
var SYNC_FAIL_STREAK=0, SYNC_ERR_HIDE_TIMER=null, BUSY_CHIP_TIMER=null;
var SYNC_RETRY_BASE=30000, SYNC_RETRY_DELAY=30000, SYNC_RETRY_MAX=480000;
function armBusyChip(){
  try{ clearTimeout(BUSY_CHIP_TIMER); }catch(e){}
  BUSY_CHIP_TIMER=setTimeout(function(){ syncChip('busy','در حال همگام‌سازی…'); }, 1200);
}
function clearBusyChip(){
  try{ clearTimeout(BUSY_CHIP_TIMER); }catch(e){}
}
/* ---------- [v2.11.15] تشخیص شفاف sync: علت آخرین شکست + حجم داده + تست اتصال ----------
   قبلاً چیپ قرمز فقط می‌گفت «ناموفق بود»؛ حالا علت دقیق (تایم‌اوت/قطع شبکه/کد HTTP سرور/
   حجم داده/نشست منقضی) و زمانش ذخیره می‌شود و در پروفایل + متن چیپ دیده می‌شود —
   گزارش کاربر = تشخیص فوری، بدون حدس. */
var LAST_SYNC_ERR_KEY='carlog:lastSyncErr';
function recordLastSyncErr(kind, status){
  try{ localStorage.setItem(LAST_SYNC_ERR_KEY, JSON.stringify({k:kind, s:status||0, t:Date.now()})); }catch(e){}
}
function clearLastSyncErr(){ try{ localStorage.removeItem(LAST_SYNC_ERR_KEY); }catch(e){} }
function syncErrShort(kind, status){

  var results=[null,null], done=0;

    var t0=performance.now();

    /* [v2.11.15] POST /api/ping با بررسی بدنه {ok:true} — تست واقعی و قابل‌اعتماد

    fetch(x.b+'/api/ping', {method:'POST', mode:'cors', cache:'no-store', headers:{'Content-Type':'application/json'}, body:'{}', signal:ctrl?ctrl.signal:undefined})
      .then(function(r){ if(!r || !r.ok) throw new Error('http'); return r.json(); })

      ['catch'](function(){ clearTimeout(timer); results[i]={ok:false, ms:Math.round(performance.now()-t0)}; })

          :'هیچ‌کدام از دو مسیر پاسخ نداد — اینترنت دستگاه را چک کنید و دوباره تست بزنید.')+'</div>';

function pushFailed(kind, status){
  PENDING_OUTBOX=true;
  armOutboxRetry();
  SYNC_FAIL_STREAK++;
  recordLastSyncErr(kind, status);
  try{ console.warn('[v2.11.7] sync push failed:', kind, '| streak:', SYNC_FAIL_STREAK); }catch(e0){}
  try{
    if(document.hidden) return; /* اپ در پس‌زمینه است — هیچ چیپی مزاحم کاربر نمی‌شود */
  }catch(e1){}
  if(SYNC_FAIL_STREAK>=4){
    try{ clearTimeout(SYNC_ERR_HIDE_TIMER); }catch(e2){}
    syncChip('err','⚠ چند تلاش پشت‌سرهم ناموفق بود ('+syncErrShort(kind,status)+') — داده‌ها روی دستگاه محفوظ‌اند و خودکار دوباره تلاش می‌کنیم؛ لمس: تلاش همین حالا');
  }else if(SYNC_FAIL_STREAK>=2){
    syncChip('warn','همگام‌سازی به‌خاطر کندی شبکه موقتاً عقب افتاد — خودکار دوباره تلاش می‌کنیم');
    try{ clearTimeout(SYNC_ERR_HIDE_TIMER); }catch(e3){}
    SYNC_ERR_HIDE_TIMER=setTimeout(function(){ if(PENDING_OUTBOX) syncChip(null); }, 8000);
  }
  /* شکست اول: بی‌صدا */
}
function armOutboxRetry(){
  try{ clearTimeout(OUTBOX_RETRY_TIMER); }catch(e){}
  OUTBOX_RETRY_TIMER=setTimeout(function(){ retryOutbox(); }, SYNC_RETRY_DELAY);
  SYNC_RETRY_DELAY=Math.min(SYNC_RETRY_DELAY*2, SYNC_RETRY_MAX);
}
function retryOutbox(){
  if(!PENDING_OUTBOX || !getAuthToken()) return;
  if(!(STATE && STATE.cars && STATE.cars.length)){ PENDING_OUTBOX=false; syncChip(null); return; }
  try{ clearTimeout(OUTBOX_RETRY_TIMER); }catch(e){}
  doCloudPush(false, true);
}
function syncChip(mode, text){
  try{
    if(typeof document==='undefined') return;
    var chip=document.getElementById('syncChip');
    if(!chip){
      chip=document.createElement('div');
      chip.id='syncChip';
      chip.setAttribute('role','status');
      chip.addEventListener('click', function(){ if(PENDING_OUTBOX) retryOutbox(); });
      if(document.body) document.body.appendChild(chip);
    }
    if(!chip) return;
    if(!mode){ chip.style.display='none'; return; }
