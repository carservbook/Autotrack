}
/* مقایسهٔ معنایی: کلیدها مرتب می‌شوند (ترتیب درج بی‌اثر) + فلگ notified (وضعیت اعلانِ
   مخصوصِ هر دستگاه، نه دادهٔ کاربر) حذف می‌شود + فیلدهای نرمالِ پیش‌فرض یکی حساب می‌شوند */
function stableValue(v, skip){
  var t=Object.prototype.toString.call(v);
  if(t==='[object Array]'){
    var out=[];
    for(var i=0;i<v.length;i++) out.push(stableValue(v[i], skip));
    return out;
  }
  if(v && t==='[object Object]'){
    var keys=Object.keys(v).sort(), o={};
    for(var j=0;j<keys.length;j++){ var k=keys[j]; if(skip && skip.test(k)) continue; o[k]=stableValue(v[k], skip); }
    return o;
  }
  if(v===undefined) return null;
  return v;
}
function statesEquivalent(a, b){
  try{
    if(!a || !b) return false;
    var na=stableValue(a, /notified/), nb=stableValue(b, /notified/);
    return JSON.stringify(na)===JSON.stringify(nb);
  }catch(e){ return false; }
}
/* هماهنگ‌سازی پس‌زمینه‌ای: رویداد online، برگشت به اپ، و هر ۵ دقیقه — با کول‌داون و
   گاردِ تعارضِ باز، تا مودالِ تعارض هرگز اسپم نشود. خودِ initCloudSync همان منطق امن
   محتوا-محور را اجرا می‌کند (پول/پوش/تعارض) و موفقیتش بی‌صدا است. */
function reconcileSync(){
  if(typeof fetch==='undefined' || !getAuthToken()) return;
  if(PENDING_CONFLICT) return; /* کاربر هنوز روی یک تعارض تصمیم نگرفته — اسپم ممنوع */
  var now=Date.now();
  if(now-LAST_RECONCILE<RECONCILE_COOLDOWN_MS) return;
  LAST_RECONCILE=now;
  if(PENDING_OUTBOX){ retryOutbox(); return; }
  initCloudSync();
}

var PENDING_CONFLICT=null; /* [S-03 fix v2.6.4] تعارض فعلی که کاربر باید درباره‌اش تصمیم بگیرد */
function applyCloudState(cloudState, cloudModified){
  /* [S-07 fix v2.6.7] آخرین خطِ دفاع: هرگز نسخهٔ خالیِ سرور جای دادهٔ غیرخالیِ دستگاه نمی‌نشیند.
     اگر این گارد شلیک شود یعنی یک مسیر دیگر اشتباه کرده — به‌جای پاک‌کردنِ بی‌سروصدا، هیچ کاری نمی‌کنیم. */
  try{
    if(cloudState && cloudState.cars && !cloudState.cars.length && STATE && STATE.cars && STATE.cars.length){
      try{ console.warn('[S-07] applyCloudState blocked: empty cloud over non-empty local'); }catch(e){}
      return false;
    }
  }catch(e){}
  /* جایگذاری نسخهٔ سرور روی STATE فعلی + ثبت مُهر و lastModified */
  STATE=cloudState;
  STATE.cars.forEach(function(c){ if(!c.notified) c.notified={}; if(!c.mileageLog) c.mileageLog=[]; if(c.currentOdo==null) c.currentOdo=0; });
  if(STATE.cars.length && (!STATE.activeCarId || !STATE.cars.some(function(c){return c.id===STATE.activeCarId;}))){
    STATE.activeCarId=STATE.cars[0].id;
  }
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
    localStorage.setItem(LAST_MODIFIED_KEY, String(cloudModified));
  }catch(e){}
  /* [L-02 fix v2.6.3] داده از سرور این حساب آمد — مُهر مالکیت بزن */
  setAccountStamp(getAuthEmail());
  setLastSyncAt();
  renderApp();
  return true;
}
/* [S-07 fix v2.6.7] تلورانس اختلاف ساعت کلاینت/سرور:
   lastModified محلی با ساعتِ خودِ دستگاه نوشته می‌شود (saveState) و updatedAt سرور با ساعتِ سرور.
   اگر اختلاف دو ساعت کمتر از این مقدار باشد، «جلوتر بودنِ محلی» قابل اعتماد نیست و به‌جای پوشِ
   خودکار، مودال تعارض نشان داده می‌شود (S-03). این همان ریشهٔ اصلیِ ماجرای «لپ‌تاپ دیتا را پاک کرد» بود:
   دستگاهِ خالی با lastModified کهنه/جلوتر (ساعتِ کلاینت یا پوشِ شکست‌خوردهٔ قبلی)، خودش را جلوتر
   می‌دید و حالتِ خالی را روی سرور پوش می‌کرد؛ بعد دستگاهِ دیگر نسخهٔ خالی را پول می‌کرد. */
var SKEW_GUARD_MS=30000;
function initCloudSync(){
  if(typeof fetch==='undefined') return;
  var token=getAuthToken();
  if(!token) return;
  apiFetch('/api/data', {method:'GET'}).then(function(res){
    if(!res.ok){
      if(res.status===401) clearAuth();
      return;
    }
    var localModified=0;
    try{ localModified=parseInt(localStorage.getItem(LAST_MODIFIED_KEY),10)||0; }catch(e){}
    var cloudModified=(res.data && res.data.updatedAt) || 0;
    var cloudState=null;
    var serverHasPayload=!!(res.data && res.data.data && String(res.data.data).length>2);
    try{ cloudState=serverHasPayload?JSON.parse(res.data.data):null; }catch(e){ cloudState=null; }
    if(serverHasPayload && !cloudState){
      /* دادهٔ سرور قابل خواندن نیست — هیچ نوشتنی مجاز نیست (نه پول، نه پوش) */
      try{ console.warn('[S-07] initCloudSync: server payload unparseable — no action'); }catch(e){}
      return;
    }
    var cloudHasCars=!!(cloudState && cloudState.cars && cloudState.cars.length>0);
    var localHasCars=!!(STATE && STATE.cars && STATE.cars.length>0);

    /* [S-07 fix v2.6.7] ماتریس تصمیمِ «محتوا-محور» — اول محتوا، بعد timestamp.
       قاعدهٔ طلایی: دادهٔ غیرخالی هرگز با حالتِ خالی جایگزین نمی‌شود؛
       پوشِ حالتِ خالی و پولِ نسخهٔ خالی روی دادهٔ غیرخالی، در هیچ شاخه‌ای وجود ندارد. */
    if(cloudHasCars && !localHasCars){
      /* سرور داده دارد و دستگاه خالی است → همیشه پول (حتی اگر lastModified محلی جلوتر باشد —
         چون حالتِ خالی هیچ‌وقت «جلوتر» نیست؛ ریشهٔ اصلیِ پاک‌شدن دیتا همین شاخه بود) */
      applyCloudState(cloudState, cloudModified);
      return;
    }
    if(!cloudHasCars && localHasCars){
      /* سرور خالی است و دستگاه داده دارد → بازیابیِ سرور از دستگاه (تنها جهتِ امنِ نوشتن) */
      doCloudPush();
      return;
    }
    if(cloudHasCars && localHasCars){
      var differs=!statesEquivalent(STATE, cloudState); /* [v2.11.5] مقایسهٔ معنایی — نه رشتهٔ خام */
      if(!differs){
        /* دو نسخه یکی است — فقط مُهرها را تازه کن */
        if(cloudModified>localModified){ try{ localStorage.setItem(LAST_MODIFIED_KEY, String(cloudModified)); }catch(e){} }
        setAccountStamp(getAuthEmail());
        setLastSyncAt();
        return;
      }
      if(cloudModified>localModified){
        /* [S-03 fix v2.6.4] نسخه‌های متفاوت — هیچ سمتِ بی‌سروصدا پاک نمی‌شود؛ کاربر تصمیم می‌گیرد */
        PENDING_CONFLICT={state:cloudState, modified:cloudModified};
        showSyncConflictModal();
        return;
      }
      if(localModified-cloudModified>SKEW_GUARD_MS){
        /* دستگاه به‌طور قابل‌اعتماد جلوتر است (اختلاف بیشتر از تلورانس ساعت) → پوش */
        doCloudPush();
        return;
      }
      /* اختلافِ کوچک/مشکوک (skew ساعت) → تصمیم با کاربر، نه پوشِ خودکار */
      PENDING_CONFLICT={state:cloudState, modified:cloudModified};
      showSyncConflictModal();
      return;
    }
    /* هر دو خالی → هیچ کاری نکن (هیچ‌وقت حالتِ خالی را پوش نکن) */
    v2113EmptyCloudHint(); /* [v2.11.13] راهنمای «داده‌ها به حساب قبلی وصله» */
  }).catch(function(err){
    /* [S-07 fix v2.6.7] خطاها دیگر بی‌صدا قورت داده نمی‌شوند — آفلاین عادی است، باگ نه */
    try{ console.warn('[S-07] initCloudSync failed (offline or bug):', err && err.message); }catch(e){}
  });
}
/* ---------- [v2.11.13] راهنمای «حساب خالی» — ریشهٔ ماجرای نصب مجدد TWA ----------
   سناریو: کاربر اپ/TWA را دوباره نصب می‌کند → حافظهٔ محلی اورجین پاک می‌شود → باید
   دوباره وارد شود. اگر با «ایمیل/گوگلِ دیگری» وارد شود، اکانتش خالی دیده می‌شود
   (داده‌ها به حساب قبلی وصله) و فکر می‌کند همه‌چیز پاک شده. این راهنما فقط وقتی
   نشان داده می‌شود که: وارد شده + سرور خالی + دستگاه خالی؛ و یک‌بار در هر باز شدن اپ. */
function v2113EmptyCloudHint(){
  try{
    if(!getAuthToken()) return;
    if(STATE && STATE.cars && STATE.cars.length) return;
    if(PENDING_CONFLICT) return;
    try{ if(sessionStorage.getItem('carlog:emptyCloudHint')) return; }catch(e1){}
    try{ sessionStorage.setItem('carlog:emptyCloudHint','1'); }catch(e2){}
    apiFetch('/api/me', {method:'GET'}).then(function(res){
      if(!res.ok || !res.data) return;
      var age=Date.now()-(parseInt(res.data.createdAt,10)||0);
      if(age>7*86400000){
        /* حسابت قدیمی است ولی داده‌ای روی سرور نیست → احتمالاً با حساب دیگری وارد شده‌ای */
        openModal(''
          +'<h2>🔍 اطلاعاتی روی این حساب پیدا نشد</h2>'
          +'<p class="sub">حسابت قدیمیه ولی هیچ داده‌ای روی سرور برایش ثبت نشده. داده‌های دفترچه به <b>همان حسابی</b> وصله که قبلاً با آن وارد شده بودی.</p>'
          +'<p class="sub" style="color:var(--dim)">مثلاً اگر قبلاً با ایمیل دیگری یا با گوگلِ دیگری وارد می‌شدی، با همان وارد شو. اگر عمداً همه‌چیز را پاک کرده بودی، این پیام را نادیده بگیر — هیچ داده‌ای پاک نشده.</p>'
          +'<div class="modal-actions"><button class="btn primary" onclick="doLogout()">ورود با حساب دیگر</button></div>'
          +'<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">متوجه شدم</button></div>'
        );
      } else if(age>90000){
        toast('اگه قبلاً با ایمیل یا گوگلِ دیگری وارد می‌شدی، اطلاعات به همان حساب وصله — با همان حساب وارد شو.');
      }
    }).catch(function(){});
  }catch(e){}
}
/* ---------- [S-03 fix v2.6.4] تعارض همگام‌سازی: دو نسخهٔ متفاوت — انتخاب کاربر ---------- */
function showSyncConflictModal(){
  var c=PENDING_CONFLICT; if(!c) return;
  var nLocal=(STATE.cars||[]).length, nCloud=(c.state.cars||[]).length;
  var localTime=(function(){ try{ return new Date(parseInt(localStorage.getItem(LAST_MODIFIED_KEY),10)).toLocaleString('fa-IR'); }catch(e){ return '—'; } })();
  var cloudTime=(function(){ try{ return new Date(c.modified).toLocaleString('fa-IR'); }catch(e){ return '—'; } })();
  openModal(''
    +'<h2>⚠️ دو نسخه‌ی متفاوت از اطلاعاتت وجود داره</h2>'
    +'<p class="sub">روی این دستگاه <b>'+toFa(nLocal)+' ماشین</b> (آخرین تغییر: '+localTime+') هست،'
    +' و روی سرور هم <b>'+toFa(nCloud)+' ماشین</b> (آخرین تغییر: '+cloudTime+') — ولی این دو نسخه یکسان نیستن.</p>'
    +'<p class="sub" style="color:var(--dim)">هیچ داده‌ای الان پاک نمی‌شه — خودت انتخاب کن کدوم بمونه. قبل از هر انتخابی، از نسخه‌ی این دستگاه پشتیبان خودکار گرفته می‌شه.</p>'
    +'<div class="modal-actions"><button class="btn primary" onclick="resolveSyncConflict(\'server\')">نسخه‌ی سرور ('+toFa(nCloud)+' ماشین) جایگزین بشه</button></div>'
    +'<div class="modal-actions"><button class="btn ghost" onclick="resolveSyncConflict(\'local\')">نسخه‌ی همین دستگاه ('+toFa(nLocal)+' ماشین) به سرور فرستاده بشه</button></div>'
  );
}
function resolveSyncConflict(choice){
  var c=PENDING_CONFLICT; if(!c) return;
  /* ایمنی: قبل از هر تصمیمی، از نسخه‌ی فعلی دستگاه پشتیبان بگیر (دانلود JSON) */
  try{ if(STATE.cars && STATE.cars.length){ exportBackup(); } }catch(e){}
  PENDING_CONFLICT=null;
  if(choice==='server'){
    applyCloudState(c.state, c.modified);
    toast('نسخه‌ی سرور برگردونده شد؛ پشتیبان نسخه‌ی قبلی دانلود شد');
    closeModal();
    renderApp();
    return;
  }
  /* [v2.11.5] نسخه‌ی دستگاه برنده است — دیگر هیچ‌چیز بی‌صدا نیست:
     بازخورد واقعی «در حال ارسال…» و بعد «ذخیره شد ✓» یا «ناموفق + تلاش مجدد خودکار».
     ریشهٔ «هیچ اتفاقی نمی‌افته» همین‌جا بود: پوش شکست می‌خورد و کاربر هیچ‌چیز نمی‌دید. */
  try{ localStorage.setItem(LAST_MODIFIED_KEY, String(Date.now())); }catch(e){}
  setAccountStamp(getAuthEmail());
  closeModal();
  renderApp();
  toast('در حال ارسال نسخه‌ی این دستگاه به سرور…');
  doCloudPush(true, true).then(function(ok){
    if(ok){ toast('نسخه‌ی این دستگاه روی سرور ذخیره شد ✓'); }
    else{ toast('ارسال ناموفق بود — خودکار دوباره تلاش می‌کنیم؛ اینترنت را هم چک کن'); }
  });
}
/* ---------- [S-04 fix v2.6.4] وضعیت همگام‌سازی: کاربر باید «ببیند» که داده روی سرور رفته ---------- */
var LAST_SYNC_KEY='carlog:lastSyncAt';
function setLastSyncAt(){ try{ localStorage.setItem(LAST_SYNC_KEY, String(Date.now())); }catch(e){} }
function getLastSyncAt(){ try{ return parseInt(localStorage.getItem(LAST_SYNC_KEY),10)||0; }catch(e){ return 0; } }
function lastSyncText(){
  var t=getLastSyncAt();
  if(!t) return 'هنوز هیچ همگام‌سازی موفقی ثبت نشده';
  var diff=Date.now()-t;
  if(diff<60000) return 'همین الان ('+new Date(t).toLocaleTimeString('fa-IR')+')';
  if(diff<3600000) return toFa(Math.floor(diff/60000))+' دقیقه پیش';
  if(diff<86400000) return toFa(Math.floor(diff/3600000))+' ساعت پیش';
  try{ return new Date(t).toLocaleString('fa-IR'); }catch(e){ return toFa(Math.floor(diff/86400000))+' روز پیش'; }
}

/* ---------- [v2.10.2] ورود با گوگل — پرش مستقیم و «هم‌دامنه» ----------
   v2.10.1 فقط سپر S-08 (probe + مودال) را حذف کرد ولی لاگین را از API_BASE عبور
   می‌داد؛ توکن در localStorage دامنهٔ api ذخیره می‌شد ولی اپی که از دامنهٔ قدیمی
   (آیکون PWA/بوکمارک) باز می‌شد توکنی نداشت → کاربر هر بار از اکانت بیرون می‌پرید.
   localStorage به دامنه وابسته است؛ پس لاگین باید روی همان دامنه‌ای کامل شود که
   شِل از آن باز شده (redirect_uri هر سه دامنه در Google Console ثبت و تأیید شد).
   prompt=select_account سمت ورکر فعال است = لیست اکانت‌ها مستقیم باز می‌شود. */
function startGoogleLogin(){
  var state=makeOAuthState();
  try{ sessionStorage.setItem('carlog:oauthState', state); }catch(e){}
  /* [v2.11.12] فیکس ورود گوگل در TWA و شِل گیتهاب: مسیر OAuth «مطلق» به اورجین فعال
     API می‌رود (مسیر نسبی روی شِل غیر-API به 404 گیتهاب می‌خورد) و آدرس برگشتِ شِل با
     back به ورکر داده می‌شود؛ توکن/خطا با #hb= روی همین دامنه ثبت می‌شود. allowlist
     مقصدهای برگشت سمت ورکر است (ضد open-redirect). */
  var apiBase=(typeof apiFailoverPreferFallback==='function' && apiFailoverPreferFallback())?API_FALLBACK_BASE:API_BASE;
  var back='';
  try{
    var here=location.origin+(location.pathname||'/');
    if(here!==apiBase+'/') back='&back='+encodeURIComponent(here);
  }catch(e){}
  location.href=apiBase+'/api/google-login?state='+state+back;
}

function doAuth(kind){
  var emailEl=document.getElementById('authEmail'), passEl=document.getElementById('authPassword');
  var email=emailEl.value.trim();
  var password=passEl.value;
  var errEl=document.getElementById('authError');
  errEl.textContent='';
  if(typeof fetch==='undefined'){ errEl.textContent='این مرورگر پشتیبانی نمیشه'; return; }
  apiFetch('/api/'+kind, {method:'POST', body: JSON.stringify({email:email,password:password})}).then(function(res){
    if(!res.ok){ errEl.textContent=(res.data && res.data.error) || 'خطایی پیش اومد'; return; }
    setAuth(res.data.token, res.data.email);
    try{ localStorage.setItem('carlog:verified', res.data.verified ? '1' : '0'); }catch(e){}
    if(kind==='register' && res.data.recoveryCode){
      initCloudSync();
      showRecoveryCode(res.data.recoveryCode);
      return;
    }
    toast(kind==='login' ? 'وارد شدی ✓' : 'حساب ساخته شد ✓');
    closeModal();
    initCloudSync();
  }).catch(function(){ errEl.textContent='اتصال برقرار نشد، اینترنتت رو چک کن'; });
}

/* [L-02 fix v2.6.3] خروج از حساب = پاک شدن کامل اطلاعات از این دستگاه.
   قبلاً فقط توکن پاک می‌شد و داده‌ی ماشین‌ها روی دستگاه می‌ماند؛ نتیجه‌اش این بود
   که اگر با حساب دیگری وارد می‌شدی، همه‌ی داده‌های حساب قبلی به حساب جدید منتقل می‌شد.
   حالا با خروج، داده‌ها از دستگاه پاک می‌شوند (نسخه‌ی سروری زیر حسابت می‌ماند و
   با ورود مجدد با همان حساب، خودکار برمی‌گردد). */
/* [S-06 fix v2.6.6] محافظ خروج:
   اگر روی دستگاه دادهٔ ماشین هست که «مطمئن نیستیم روی سرور باشد» (هیچ‌وقت همگام موفق نشده
   یا آخرین تغییر محلی بعد از آخرین همگام‌سازی است)، خروج مستقیم انجام نمی‌شود؛
   اول همگام‌سازی/پشتیبان‌گیری پیشنهاد می‌شود. escape hatch هم هست (اختیار نهایی با کاربر).
   زمینه: دادهٔ گوشی کاربر در ماجرای اخیر با خروگی که دادهٔ محلیِ هرگز-پوش-نشده را پاک کرد
   و سرور هم نسخه‌ای نداشت، از دست رفت. */
function doLogout(){
  var hasCars = STATE.cars && STATE.cars.length>0;
  var lastSync = 0; try{ lastSync=parseInt(localStorage.getItem(LAST_SYNC_KEY),10)||0; }catch(e){}
  var lastMod = 0; try{ lastMod=parseInt(localStorage.getItem(LAST_MODIFIED_KEY),10)||0; }catch(e){}
  var unsynced = hasCars && (lastSync===0 || lastMod>lastSync);
  if(unsynced){
    openModal(''
      +'<h2>⚠️ اول پشتیبان — بعد خروج</h2>'
      +'<p class="sub">روی این دستگاه <b>'+toFa(STATE.cars.length)+' ماشین</b> هست که هنوز مطمئن نیستیم روی سرور ذخیره شده باشد. با خروج، همه‌ی اطلاعات از همین دستگاه پاک می‌شود و اگر روی سرور نباشد، دیگر قابل برگرداندن نیست.</p>'
      +'<p class="sub" style="color:var(--dim)">پیشنهاد: اول یکی از دو دکمهٔ زیر را بزن؛ بعد از موفقیت، از همین مودال خارج شو.</p>'
      +'<div class="modal-actions"><button class="btn primary" onclick="manualSync()">همگام‌سازی الان</button></div>'
      +'<div class="modal-actions"><button class="btn ghost" onclick="exportBackup()">خروجی گرفتن (JSON)</button></div>'
      +'<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">انصراف</button></div>'
      +'<div class="danger-link" onclick="doLogoutConfirmed()">با این حال خارج شو (اطلاعات این دستگاه پاک می‌شود)</div>'
    );
    return;
  }
  openModal(''
    +'<h2>خروج از حساب</h2>'
    +'<p class="sub">با خروج، همه‌ی اطلاعات ماشین‌ها از حافظه‌ی همین دستگاه پاک میشه.</p>'
    +'<p class="sub">نگران نباش — آخرین وضعیت این دستگاه با سرور همگام است؛ با ورود مجدد با همین حساب، همه‌چیز خودکار برمی‌گردد.</p>'
    +'<div class="modal-actions"><button class="btn primary" onclick="doLogoutConfirmed()" style="color:var(--danger);border-color:var(--danger)">خروج و پاک کردن اطلاعات از این دستگاه</button></div>'
    +'<div class="modal-actions"><button class="btn ghost" onclick="openProfileModal()">انصراف</button></div>'
  );
}

/* [S-05 fix v2.6.5] همگام‌سازی دستیِ جهت‌آگاه:
   اول وضعیت سرور خوانده می‌شود؛ اگر سرور جلوتر بود (مثلاً دستگاهی که تازه وارد شده و خالی است)
   نسخهٔ سرور «گرفته» می‌شود — نه اینکه حالتِ خالیِ محلی روی سرور بازنویسی شود.
   در v2.6.4 پوشِ بی‌قیدوشرط بود و فشردن این دکمه روی دستگاه خالی می‌توانست دادهٔ سرور را پاک کند.
   تعارض واقعی (هر دو نسخه ماشین دارند ولی متفاوت‌اند) → مودال انتخاب + پشتیبان خودکار (S-03). */
/* [S-07 fix v2.6.7] همگام‌سازی دستیِ محتوا-محور:
   v2.6.5 هنوز یک مسیر پاک‌کننده داشت: اگر lastModified دستگاه کهنه/جلوتر بود و دستگاه خالی بود،
   (cloudHasCars && cloudModified<=localModified) به پوشِ حالتِ خالی می‌افتاد و سرور پاک می‌شد.
   حالا مثل initCloudSync اول «محتوا» تصمیم می‌گیرد، بعد timestamp:
   سرور داده دارد + دستگاه خالی → پول | سرور خالی + دستگاه داده دارد → پوش بازیابی |
   هر دو دارند و متفاوت → مودال تعارض (S-03) | هر دو خالی → هیچ نوشتنی. */
function manualSync(){
  if(!getAuthToken()){ toast('اول وارد حساب شو'); return; }
  var btn=document.getElementById('syncBtn');
  var originalText='همگام‌سازی الان';
  function resetBtn(ok){
    if(!btn) return;
    btn.classList.remove('syncing');
    if(ok){
      btn.classList.add('synced');
      btn.innerHTML=iconCheck()+' همگام شد';
      setTimeout(function(){
        btn.classList.remove('synced');
        btn.disabled=false;
        btn.textContent=originalText;
      }, 2000);
    } else {
      btn.disabled=false;
      btn.textContent=originalText;
    }
  }
  if(btn){ btn.disabled=true; btn.classList.add('syncing'); btn.textContent='در حال همگام‌سازی...'; }
  apiFetch('/api/data', {method:'GET'}).then(function(res){
    if(!res.ok){
      if(res.status===401){ clearAuth(); closeModal(); renderApp(); toast('نشست تمام شده — دوباره وارد حساب شو'); }
      else{ toast((res.status===0) ? 'اتصال برقرار نشد' : 'همگام‌سازی ناموفق بود (خطای سرور)'); }
      resetBtn(false);
      return;
    }
    var localModified=0;
    try{ localModified=parseInt(localStorage.getItem(LAST_MODIFIED_KEY),10)||0; }catch(e){}
    var cloudModified=(res.data&&res.data.updatedAt)||0;
    var cloudState=null;
    var serverHasPayload=!!(res.data&&res.data.data&&String(res.data.data).length>2);
    try{ cloudState=serverHasPayload?JSON.parse(res.data.data):null; }catch(e){ cloudState=null; }
    if(serverHasPayload && !cloudState){
      /* دادهٔ سرور قابل خواندن نیست — برای امنیت داده، هیچ نوشتنی مجاز نیست */
      toast('دادهٔ سرور قابل خواندن نیست — برای امنیت داده، همگام‌سازی متوقف شد');
      resetBtn(false);
      return;
    }
    var cloudHasCars=!!(cloudState&&cloudState.cars&&cloudState.cars.length>0);
    var localHasCars=!!(STATE.cars&&STATE.cars.length>0);
    var differs=!statesEquivalent(STATE, cloudState); /* [v2.11.5] مقایسهٔ معنایی — نه رشتهٔ خام */

    if(cloudHasCars && !localHasCars){
      /* [S-07] سرور داده دارد و دستگاه خالی است → بگیر، هیچ‌وقت نفرست (حتی با lastModified جلوتر) */
      applyCloudState(cloudState, cloudModified);
      closeModal();
      toast('از سرور گرفته شد ✓');
      resetBtn(true);
      return;
    }
    if(!cloudHasCars && localHasCars){
      /* [S-07] سرور خالی است → بازیابی سرور از دستگاه (جهت امن: پر روی خالی) */
      apiFetch('/api/data', {method:'POST', body: JSON.stringify({data: STATE})}).then(function(res2){
        if(res2.ok){ setAccountStamp(getAuthEmail()); setLastSyncAt(); toast('همگام‌سازی شد ✓'); resetBtn(true); }
        else { toast('همگام‌سازی ناموفق بود'); resetBtn(false); }
      }).catch(function(){ toast('اتصال برقرار نشد'); resetBtn(false); });
      return;
    }
    if(cloudHasCars && localHasCars){
      if(differs){
        /* هیچ سمتِ بی‌سروصدا پاک نمی‌شود — کاربر تصمیم می‌گیرد (پشتیبان خودکار داخل resolveSyncConflict) */
        PENDING_CONFLICT={state:cloudState, modified:cloudModified};
        showSyncConflictModal();
        return;
      }
      /* یکسان‌اند — فقط مُهرها را تازه کن */
      if(cloudModified>localModified){ try{ localStorage.setItem(LAST_MODIFIED_KEY, String(cloudModified)); }catch(e){} }
      setAccountStamp(getAuthEmail());
      setLastSyncAt();
      toast('همگام‌سازی شد ✓');
      resetBtn(true);
      return;
    }
    /* هر دو خالی — پوشِ حالتِ خالی بی‌معناست؛ فقط تأیید نشان بده */
    setAccountStamp(getAuthEmail());
    setLastSyncAt();
    toast('همگام‌سازی شد ✓');
    resetBtn(true);
  }).catch(function(err){
    /* [v2.11.5] دلیل واقعی دیده می‌شود — timeout جدا از قطعیِ کامل */
    toast((err && err.message==='TIMEOUT') ? 'اتصال خیلی کند بود — دوباره امتحان کن' : 'اتصال برقرار نشد');
    resetBtn(false);
  });
}

function importBackup(){
  var f=document.getElementById('importFile').files[0];
  if(!f){ toast('فایلی انتخاب نشده'); return; }
  /* [B-03 fix] اعتبارسنجی ساختار + پاک‌سازی تایپ‌ها قبل از جایگزینی STATE.
     قبلاً فایل خراب مستقیم STATE می‌شد و در localStorage هم ذخیره می‌شد (کرش پایدار).
     حالا تایپ‌های شناخته‌شده اصلاح و داده ناشناخته حفظ می‌شود تا چیزی از دست نرود. */
  if(f.size > 15*1024*1024){ toast('حجم فایل بیش از حد مجاز است'); return; }
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data || typeof data!=='object' || Array.isArray(data)) throw new Error('bad root');
      if(!Array.isArray(data.cars) || !data.cars.length) throw new Error('bad cars');
      function _carSan(c){
        if(!c || typeof c!=='object' || Array.isArray(c)) return null;
        var out={};
        for(var k in c){ if(Object.prototype.hasOwnProperty.call(c,k)) out[k]=c[k]; }
        if(typeof out.id!=='string' || !out.id) out.id=uid('c');
        ['name','model','plate','plateN1','plateLetter','plateN2','plateRegion','engineNumber','vin','year','note'].forEach(function(k){
          if(out[k]==null) out[k]='';
          if(typeof out[k]!=='string') out[k]=String(out[k]);
          if(out[k].length>300) out[k]=out[k].slice(0,300);
        });
        if(typeof out.currentOdo!=='number' || !isFinite(out.currentOdo)){
          out.currentOdo=isFinite(+out.currentOdo)? +out.currentOdo : 0;
        }
        if(out.currentOdo<0) out.currentOdo=0;
        if(!Array.isArray(out.services)) out.services=[];
        out.services=out.services.filter(function(s){ return s && typeof s==='object' && !Array.isArray(s); }).slice(0,500);
        if(!Array.isArray(out.mileageLog)) out.mileageLog=[];
        out.mileageLog=out.mileageLog.filter(function(m){ return m && typeof m==='object'; }).slice(0,2000);
        if(!out.notified || typeof out.notified!=='object' || Array.isArray(out.notified)) out.notified={};
        return out;
      }
      var clean={ cars:[], activeCarId:null };
      if(typeof data.activeCarId==='string') clean.activeCarId=data.activeCarId;
      data.cars.forEach(function(c){ var car=_carSan(c); if(car) clean.cars.push(car); });
      if(!clean.cars.length) throw new Error('no valid car');
      if(!clean.activeCarId || !clean.cars.some(function(c){return c.id===clean.activeCarId;})) clean.activeCarId=clean.cars[0].id;
      STATE=clean;
      saveState(); closeModal(); renderApp(); toast('بازگردانی شد ✓');
    }catch(err){ toast('فایل معتبر نیست'); }
  };
  reader.readAsText(f);
}

function urlBase64ToUint8Array(base64String){
  var padding='='.repeat((4-base64String.length%4)%4);
  var base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  var raw=atob(base64);
  var out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function getPushSubscribeState(){
  try{ return localStorage.getItem('carlog:pushSubscribed')==='1'; }catch(e){ return false; }
}
function setPushSubscribeState(v){
  try{ localStorage.setItem('carlog:pushSubscribed', v?'1':'0'); }catch(e){}
}
function enableBackgroundPush(){
  if(!getAuthToken()){ toast('اول وارد حساب شو، چون این قابلیت به داده‌ی روی سرور نیاز داره'); return; }
  if(typeof Notification==='undefined' || !('serviceWorker' in navigator) || !('PushManager' in window)){
    toast('این مرورگر نوتیفیکیشن پس‌زمینه رو پشتیبانی نمی‌کنه'); return;
  }
  Notification.requestPermission().then(function(perm){
    if(perm!=='granted'){ toast('اجازه‌ی نوتیفیکیشن داده نشد'); return; }
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }).then(function(sub){
      var subJson=sub.toJSON();
      return apiFetch('/api/push-subscribe', {method:'POST', body: JSON.stringify({
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth
      })});
    }).then(function(res){
      if(res.ok){ setPushSubscribeState(true); toast('نوتیفیکیشن پس‌زمینه فعال شد ✓'); openProfileModal(); }
      else { toast((res.data && res.data.error) || 'ثبت نوتیفیکیشن ناموفق بود'); }
    }).catch(function(err){ toast('خطا در فعال‌سازی: '+(err && err.message ? err.message : 'نامشخص')); });
  });
}

/* ---------- تنظیمات یادآور (carlog:reminders) ---------- */
function getRemSettings(){
  try{
    var s=JSON.parse(localStorage.getItem('carlog:reminders')||'{}');
    return {
      leadDays: [1,2,3,5,7].indexOf(s.leadDays)>-1 ? s.leadDays : 3,
      warnNotify: s.warnNotify!==false,
      quietOn: !!s.quietOn,
      quietStart: (s.quietStart!=null&&s.quietStart>=0&&s.quietStart<24)?s.quietStart:22,
      quietEnd: (s.quietEnd!=null&&s.quietEnd>=0&&s.quietEnd<24)?s.quietEnd:8
    };
  }catch(e){ return {leadDays:3, warnNotify:true, quietOn:false, quietStart:22, quietEnd:8}; }
}
function setRemSettings(s){ try{ localStorage.setItem('carlog:reminders', JSON.stringify(s)); }catch(e){} }
function inQuietHours(){
  var cfg=getRemSettings();
  if(!cfg.quietOn) return false;
  var h=new Date().getHours();
  if(cfg.quietStart===cfg.quietEnd) return false;
  if(cfg.quietStart<cfg.quietEnd) return h>=cfg.quietStart && h<cfg.quietEnd;
  return h>=cfg.quietStart || h<cfg.quietEnd;
}

/* ---------- یادگیری بازه از تاریخچه (حداقل ۲ ثبت با فاصلهٔ بیش از ۲ هفته) ---------- */
function learnIntervalDays(service){
  var h=service.history||[];
  var js=[];
  h.forEach(function(x){ var j=parseJalaliStr(x.date); if(j) js.push(j); });
  if(js.length<2) return null;
  js.sort(function(a,b){ return jalaliKey(a)-jalaliKey(b); });
  var gaps=[];
  for(var i=1;i<js.length;i++){
    var g=daysBetweenJalali(js[i-1], js[i]);
    if(g>=14) gaps.push(g);
  }
  if(!gaps.length) return null;
  gaps.sort(function(a,b){ return a-b; });
  return gaps[Math.floor(gaps.length/2)];
}
function learnableServices(){
  var out=[];
  STATE.cars.forEach(function(car){
    car.services.forEach(function(s){
      var li=learnIntervalDays(s);
      if(li && s.intervalDays && Math.abs(li-s.intervalDays)>=2 && li>=14 && li<=730){
        out.push({car:car, s:s, learned:li, current:s.intervalDays});
      }
    });
  });
  return out;
}

/* ---------- عبارت هوشمند فاصله تا موعد ---------- */
function duePhrase(st){
  var bits=[];
  if(st.daysLeft!=null && st.daysLeft>0) bits.push(toFa(st.daysLeft)+' روز مانده');
  if(st.kmLeft!=null && st.kmLeft>0) bits.push('حدود '+toFa(Math.max(1,Math.round(st.kmLeft)))+' کیلومتر مانده');
  if(st.nextDateEst) bits.push('پیش‌بینی تاریخ: '+st.nextDateEst);
  return bits.length? bits.join(' — ') : 'همین روزها';
}

/* ---------- تله‌متری: صف خطا + پینگ روزانه (بدون هیچ اثری روی استفادهٔ اپ) ---------- */
var ERRQ_KEY='carlog:errq';
function v27QueueError(info){
  try{
    var q=JSON.parse(localStorage.getItem(ERRQ_KEY)||'[]');
    q.push(info);
    while(q.length>20) q.shift();
    localStorage.setItem(ERRQ_KEY, JSON.stringify(q));
  }catch(e){}
}
function flushErrorQueue(){
  if(typeof fetch==='undefined') return;
  var q=null;
  try{ q=JSON.parse(localStorage.getItem(ERRQ_KEY)||'[]'); }catch(e){ return; }
  if(!q || !q.length) return;
  var batch=q.splice(0,5);
  try{ localStorage.setItem(ERRQ_KEY, JSON.stringify(q)); }catch(e){}
  apiFetch('/api/log-error', {method:'POST', body: JSON.stringify({errors:batch, v:APP_VERSION})}).catch(function(){
    try{
      var q2=JSON.parse(localStorage.getItem(ERRQ_KEY)||'[]');
      localStorage.setItem(ERRQ_KEY, JSON.stringify(batch.concat(q2).slice(-20)));
    }catch(e){}
  });
}
function v27DailyPing(ev, extra){
  try{
    var key='carlog:ping:'+ev;
    var today=jalaliKey(todayJalali())+'';
    if(localStorage.getItem(key)===today) return;
    localStorage.setItem(key, today);
    var body={ev:ev, v:APP_VERSION};
    if(extra) for(var k in extra) body[k]=extra[k];
    apiFetch('/api/ping', {method:'POST', body: JSON.stringify(body)}).catch(function(){});
  }catch(e){}
}
window.addEventListener('error', function(e){
  v27QueueError({t:Date.now(), page:'error', msg:String((e&&e.message)||'').slice(0,180), src:String((e&&e.filename)||'').slice(0,80), ln:(e&&e.lineno)||0});
  setTimeout(flushErrorQueue, 3000);
});
window.addEventListener('unhandledrejection', function(e){
  var r=e&&e.reason;
  v27QueueError({t:Date.now(), page:'promise', msg:String((r&&r.message)||r||'').slice(0,180)});
  setTimeout(flushErrorQueue, 3000);
});

/* ---------- ۲) گزارش هزینه: ماهانه/سالانه + دسته‌بندی — کاملاً آفلاین ---------- */
var J_MONTH_NAMES=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var COST_PERIOD_KEY='carlog:costPeriod';
var COST_SCOPE_KEY='carlog:costScope';
function getCostPeriod(){ try{ return localStorage.getItem(COST_PERIOD_KEY)||'thisyear'; }catch(e){ return 'thisyear'; } }
function setCostPeriod(p){ try{ localStorage.setItem(COST_PERIOD_KEY,p); }catch(e){} openCostReport(); }
function getCostScope(){ try{ return localStorage.getItem(COST_SCOPE_KEY)||'car'; }catch(e){ return 'car'; } }
function setCostScope(s){ try{ localStorage.setItem(COST_SCOPE_KEY,s); }catch(e){} openCostReport(); }
function collectCostEntries(scope){
  var cars = scope==='all' ? STATE.cars : [activeCar()].filter(Boolean);
  var out=[];
  cars.forEach(function(car){
    (car.services||[]).forEach(function(s){
      (s.history||[]).forEach(function(h){
        if(!(h.cost>0)) return;
        var j=parseJalaliStr(h.date);
        if(!j) return;
        out.push({cost:h.cost, jy:j.jy, jm:j.jm, car:car, s:s, h:h});
      });
    });
  });
  return out;
}
function costPeriodFilter(entries, period){
  var t=todayJalali();
  if(period==='all') return entries;
  if(period==='lastyear') return entries.filter(function(e){ return e.jy===t.jy-1; });
  if(period==='last12'){
    var cur=t.jy*12+(t.jm-1);
    return entries.filter(function(e){ var m=e.jy*12+(e.jm-1); return m<=cur && m>cur-12; });
  }
  return entries.filter(function(e){ return e.jy===t.jy; }); /* thisyear */
}
function renderCostPeriodBars(entries, period){
  var t=todayJalali();
  var buckets=[], labels=[];
  if(period==='all'){
    var years={};
    entries.forEach(function(e){ years[e.jy]=(years[e.jy]||0)+e.cost; });
    Object.keys(years).map(Number).sort(function(a,b){return a-b;}).slice(-8).forEach(function(y){
      buckets.push(years[y]); labels.push(toFa(y));
    });
  } else {
    var startJy, startJm, count;
    if(period==='thisyear'){ startJy=t.jy; startJm=1; count=t.jm; }
    else if(period==='lastyear'){ startJy=t.jy-1; startJm=1; count=12; }
    else {
      var c12=t.jy*12+(t.jm-1)-11;
      startJy=Math.floor(c12/12); startJm=(c12%12)+1; count=12;
    }
    for(var i=0;i<count;i++){
      var mIdx=(startJm-1+i), jy=startJy+Math.floor(mIdx/12), jm=(mIdx%12)+1;
      var sum=0;
      entries.forEach(function(e){ if(e.jy===jy&&e.jm===jm) sum+=e.cost; });
      buckets.push(sum); labels.push(J_MONTH_NAMES[jm-1]);
    }
  }
  if(!buckets.length) return '';
  var max=Math.max.apply(null,buckets);
  if(max<=0) return '';
  var html='';
  buckets.forEach(function(v,i){

/* ---------- ۳) خلاصهٔ قابل‌کپی برای مکانیک ---------- */
function buildMechanicSummary(car){
  var lines=[];
  lines.push('خودرو: '+([car.name,car.model].filter(Boolean).join(' — ')||'بدون نام'));
  if(plateHasParts(car)) lines.push('پلاک: '+car.plateN1+' '+car.plateLetter+' '+car.plateN2+' — ایران '+car.plateRegion);
  lines.push('کیلومتر فعلی: '+car.currentOdo);
  lines.push('تاریخ خلاصه: '+jalaliStr(todayJalali()));
  var picked=[];
  (car.services||[]).forEach(function(s){
    var st=computeStatus(s,car);
    if(st.status==='danger'||st.status==='warn') picked.push({s:s,st:st});
  });
  function lineOf(x){
    var last=lastEntry(x.s);
    var bits=[x.s.name];
    bits.push(x.st.status==='danger'?'موعد رسیده':duePhrase(x.st));
    if(last) bits.push('آخرین: '+last.date+(last.odometer!=null?' در '+last.odometer+' کیلومتر':''));
    if(x.s.note) bits.push('نکته: '+x.s.note);
    return '• '+bits.join(' — ');
  }
  if(picked.length){
    lines.push('');
    lines.push('کارهای نیازمند توجه:');
    picked.forEach(function(x){ lines.push(lineOf(x)); });
  }
  var pickedIds={};
  picked.forEach(function(x){ pickedIds[x.s.id]=1; });
  var notes=[];
  (car.services||[]).forEach(function(s){
    if(s.note && !pickedIds[s.id]) notes.push('• '+s.name+' — '+s.note);
  });
  if(notes.length){
    lines.push('');
    lines.push('نکات فنی دیگر:');
    notes.forEach(function(n){ lines.push(n); });
  }
  return lines.join('\n');
}
function openMechanicSummary(carId){
  var car=findCar(carId)||activeCar();
  if(!car) return;
  var text=buildMechanicSummary(car);
  openModal(''
    +'<h2>خلاصه برای مکانیک</h2>'
    +'<p class="sub">این متن را کپی کن و برای مکانیک بفرست یا نشانش بده.</p>'
    +'<textarea class="mech-box" id="ms8Text" readonly>'+escapeHtml(text)+'</textarea>'
    +'<div class="modal-actions"><button class="btn primary" onclick="copyMechanicSummary()">کپی متن</button><button class="btn ghost" onclick="closeModal()">بستن</button></div>'
  );
}
function copyMechanicSummary(){
  var el=document.getElementById('ms8Text'); if(!el) return;
  el.focus(); el.select();
  function done(){ toast('کپی شد ✓'); v27DailyPing('mechcopy'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.value).then(done, function(){ fallbackCopyMechanic(el, done); });
  } else {
    fallbackCopyMechanic(el, done);
  }
}
function fallbackCopyMechanic(el, done){
  try{
    if(document.execCommand('copy')){ done(); return; }
  }catch(e){}
  toast('کپی خودکار نشد — متن را دستی انتخاب و کپی کن');

function hsParseDateLoose(v){
  var p=String(v||'').trim().split(/[\/\-]/).map(function(x){ return parseInt(toEnglishDigits(x),10); });
  if(p.length!==3 || p.some(isNaN)) return null;
  if(p[0]<200 || p[1]<1 || p[1]>12 || p[2]<1 || p[2]>31) return null;
  return {jy:p[0],jm:p[1],jd:p[2]};
}
function hsKeyOf(dateStr){
  var j=parseJalaliStr(dateStr);
  return j?jalaliKey(j):0;
}
function renderHistorySearchResults(){
  var box=document.getElementById('hs8Results'); if(!box) return;
  var qEl=document.getElementById('hs8Q');
  var qRaw=qEl?qEl.value:'';
  var q=normalizeFa(qRaw);
  var qEn=qRaw?toEnglishDigits(qRaw).replace(/\s+/g,' '):'';
  var fromJ=hsParseDateLoose(document.getElementById('hs8From')?document.getElementById('hs8From').value:'');
  var toJ=hsParseDateLoose(document.getElementById('hs8To')?document.getElementById('hs8To').value:'');
  var results=[];
  STATE.cars.forEach(function(car){
    (car.services||[]).forEach(function(s){
      (s.history||[]).forEach(function(h, idx){
        var k=hsKeyOf(h.date);
        if(fromJ && k<jalaliKey(fromJ)) return;
        if(toJ && k>jalaliKey(toJ)) return;
        if(q){
          var hay=normalizeFa([s.name, s.note, h.date, h.cost, h.odometer].join(' '));
          if(hay.indexOf(q)===-1 && hay.indexOf(qEn)===-1) return;
        }
        results.push({car:car, s:s, h:h, idx:idx});
      });
    });
  });
  results.sort(function(a,b){ return hsKeyOf(b.h.date)-hsKeyOf(a.h.date); });
  var sum=0; results.forEach(function(r){ if(r.h.cost>0) sum+=r.h.cost; });
  var html='';
  if(results.length){
    html+='<div class="hs-total">'+toFa(results.length)+' رکورد پیدا شد'+(sum>0?' — مجموع: '+faNum(sum)+' تومان':'')+'</div>';
    results.slice(0,60).forEach(function(r){
      var h=r.h;
      html+='<div class="hs-result">'
        +'<div class="hs-result-main"><span><b>'+escapeHtml(r.s.name)+'</b> — '+escapeHtml(r.car.name||'')+'</span><span>'+toFa(h.date)+(h.cost?' — '+faNum(h.cost)+' تومان':'')+'</span></div>'
        +'<div class="hs-result-sub">'
        +'<span>'+(h.odometer!=null?(faNum(h.odometer)+' کیلومتر'):'')+(r.s.note?' — '+escapeHtml(r.s.note):'')+'</span>'
        +'<span style="display:flex;gap:10px;flex-shrink:0">'
        +'<span style="color:var(--accent);font-size:11px;font-weight:700;cursor:pointer" onclick="openEditModal(\''+r.s.id+'\')">ویرایش</span>'
        +'<span class="hs-del" onclick="deleteHistoryFromSearch(\''+r.car.id+'\',\''+r.s.id+'\','+r.idx+')">حذف</span>'
        +'</span>'
        +'</div>'
        +'</div>';
    });
    if(results.length>60) html+='<p class="sub">فقط ۶۰ رکورد اول نشان داده شد — بازهٔ تاریخ را دقیق‌تر کن.</p>';
  } else {
    html='<div class="cost-empty">'+((q||fromJ||toJ)?'چیزی مطابق جستجو پیدا نشد.':'چیزی برای نمایش نیست — کلیدواژه بنویس.')+'</div>';
  }
  box.innerHTML=html;
  v27DailyPing('histsearch');
}
function deleteHistoryFromSearch(carId, serviceId, idx){
  var car=findCar(carId); if(!car) return;
  var s=car.services.find(function(x){return x.id===serviceId;}); if(!s) return;
  var h=s.history[idx]; if(!h) return;
  if(!confirm('حذف رکورد '+h.date+' از «'+s.name+'»؟')) return;
  s.history.splice(idx,1);
  saveState();
  if(STATE.activeCarId===carId) renderApp();
  renderHistorySearchResults();
  toast('حذف شد');
}

   مکانیک با لینک فقط مشخصات عمومی و تاریخچهٔ سرویس همین خودرو را

var SHARE_LAST_CREATED=null;
function shareUrlOf(token){ return location.origin+'/s/'+token; } /* [v2.10.0] داینامیک — سازگار با هر دامنهٔ میزبان */
function jDateOfTs(ts){
  try{
    var d=new Date(Number(ts));
    var j=g2j(d.getFullYear(), d.getMonth()+1, d.getDate());
    return jalaliStr({jy:j[0],jm:j[1],jd:j[2]});
  }catch(e){ return '—'; }
}
function shareCopyText(txt, okMsg){
  function done(){ toast(okMsg||'کپی شد ✓'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ shareFallbackCopy(txt, done); });
  } else {
    shareFallbackCopy(txt, done);
  }
}
function shareFallbackCopy(txt, done){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(ok){ done(); return; }
  }catch(e){}
  toast('کپی خودکار نشد — لینک را دستی کپی کن');
}

function shareRevokeLink(token, carId){
  if(!confirm('این لینک حذف شود؟ مکانیک دیگر نمی‌تواند تاریخچه را ببیند.')) return;
  apiFetch('/api/share/revoke', {method:'POST', body: JSON.stringify({token:token})}).then(function(res){
    if(res.ok && res.data && res.data.ok){
      if(SHARE_LAST_CREATED===token) SHARE_LAST_CREATED=null;
      toast('لینک حذف شد — دسترسی مکانیک قطع شد');
      openShareView(carId||undefined);
    } else {
      toast((res.data&&res.data.error)||'حذف ناموفق بود');
    }
  }).catch(function(){ toast('اتصال برقرار نشد'); });
}

/* ---------- پایان قابلیت‌های v2.9.0 ---------- */

/* ---------- پنل ادمین (فقط carservbook@gmail.com) ---------- */
function isAdminAccount(){
  try{ return (getAuthEmail()||'').toLowerCase()===SUPPORT_EMAIL; }catch(e){ return false; }
}
function openAdminView(){
  if(!isAdminAccount()){ toast('این بخش فقط برای ادمین است'); return; }
  if(!getAuthToken()){ toast('اول وارد حسابت شو'); openProfileModal(); return; }
  openModal('<h2>مدیریت</h2><p class="sub">در حال گرفتن آمار از سرور…</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">بستن</button></div>');
  Promise.all([
    apiFetch('/api/admin/stats'),
    apiFetch('/api/admin/errors'),
    apiFetch('/api/broadcast')
  ]).then(function(rs){
    var st=rs[0], er=rs[1], bc=rs[2];
    if(!st.ok || !st.data || !st.data.ok){
      /* [v2.9.0] سرور در دسترس نبود (مثلاً بدون VPN) → آخرین آمارِ موفق ذخیره‌شده نمایش داده می‌شود */
      var cached=readAdminStatsCache();
      if(cached){ renderAdminPanel(cached.stats, cached.errors||[], cached.bc||null, cached.ts); return; }
      renderAdminUnavailable(st); return;
    }
    saveAdminStatsCache(st.data.stats||st.data, (er.ok&&er.data&&er.data.errors)? er.data.errors : [], bc.ok&&bc.data? bc.data : null);
    renderAdminPanel(st.data.stats||st.data, (er.ok&&er.data&&er.data.errors)? er.data.errors : [], bc.ok&&bc.data? bc.data : null, null);
  }).catch(function(){
    /* [v2.9.0] همان فالبک برای خطای شبکه */
    var cached2=readAdminStatsCache();
    if(cached2){ renderAdminPanel(cached2.stats, cached2.errors||[], cached2.bc||null, cached2.ts); return; }
    renderAdminUnavailable(null);
  });
}
/* [v2.9.0] کش محلی آخرین آمار موفق پنل مدیریت — بدون دادهٔ شخصی کاربران (همان اعداد خود پنل) */
function saveAdminStatsCache(stats, errors, bc){
  try{ localStorage.setItem('carlog:adminCache', JSON.stringify({ts:Date.now(), stats:stats, errors:errors, bc:bc})); }catch(e){}
}
function readAdminStatsCache(){
  try{
    var cv=JSON.parse(localStorage.getItem('carlog:adminCache')||'null');
    if(cv && cv.stats) return cv;
  }catch(e){}
  return null;
}
function renderAdminUnavailable(st){
  var why;
  if(st && st.status===403) why='دسترسی ادمین روی سرور فعال نشده. مطمئن شو «ورکر کامل v2.9» (فایل index.js داخل بسته) نصب و Deploy شده و با ایمیل carservbook@gmail.com وارد شده‌ای — برخلاف روش قدیمی آداون، ورود با گوگل هم خودکار شناخته می‌شود.';
  else why='پنل مدیریتی به نصب «ورکر کامل v2.9» روی Worker نیاز دارد (فایل index.js داخل بسته — کل کد فعلی Worker را با آن جایگزین کن). تا آن موقع آمار روی سرور جمع نمی‌شود.';
  openModal('<h2>مدیریت</h2><p class="sub">'+why+'</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">بستن</button></div>');
}
function adminRow(label, val){
  return '<div class="help-item"><b>'+label+'</b><span>'+(val==null?'—':val)+'</span></div>';
}
function renderAdminPanel(st, errs, bc, offlineTs){ /* [v2.9.0] offlineTs=زمان آخرین آمار موفق */
  var html='<h2>مدیریت</h2>';
  if(offlineTs){ html+='<div class="share-offline-note">اتصال به سرور برقرار نبود — نمایش «آخرین آمارِ موفق» ('+escapeHtml(jDateOfTs(offlineTs))+'). برای آمار زنده، با اتصال برقرار (در صورت نیاز با VPN) دوباره باز کن.</div>'; }
  html+='<div class="help-list">'
    +adminRow('حساب‌های ثبت‌شده', toFa(st.totalAccounts||0))
    +adminRow('ورودهای امروز', toFa(st.loginsToday||0)+' (گوگل: '+toFa(st.googleLoginsToday||0)+')')
    +adminRow('ورودهای ۷ روز اخیر', toFa(st.logins7||0))
    +adminRow('کاربران فعال ۷ روز', toFa(st.active7||0))
    +adminRow('کاربران فعال ۳۰ روز', toFa(st.active30||0))
    +adminRow('حساب‌های جدید امروز', toFa(st.newToday||0))
    +adminRow('باز شدن اپ امروز', toFa(st.opensToday||0))
    +adminRow('نصب PWA (کل)', toFa(st.installs||0))
    +adminRow('تلاش ورود گوگل امروز', toFa(st.oauthToday||0))
    +adminRow('مودال اختلال گوگل (S-08) امروز', toFa(st.s08Today||0))
    +adminRow('ماشین‌ها / کارهای ثبت‌شده (نمای کلی)', toFa(st.totalCars||0)+' / '+toFa(st.totalServices||0))
    +adminRow('امروز — ثبت سریع / گزارش هزینه', toFa(st.qlogToday||0)+' / '+toFa(st.costviewToday||0)) /* [v2.8.0] */
    +adminRow('امروز — خلاصهٔ مکانیک / جستجوی تاریخچه', toFa(st.mechcopyToday||0)+' / '+toFa(st.histsearchToday||0)) /* [v2.8.0] */
    +adminRow('امروز — ساخت گزارش اشتراکی / بازدید لینک', toFa(st.shareCreateToday||0)+' / '+toFa(st.shareViewToday||0)) /* [v2.9.0] */
  +'</div>';
  var vkeys=Object.keys(st.versions||{});
  if(vkeys.length){
    html+='<div class="section-title" style="margin:14px 4px 6px">توزیع نسخهٔ اپ (باز شدن‌ها)</div><div class="help-list">';
    vkeys.sort(function(a,b){ return (st.versions[b]||0)-(st.versions[a]||0); });
    vkeys.forEach(function(v){ html+=adminRow('نسخه '+escapeHtml(String(v)), toFa(st.versions[v])); });
    html+='</div>';
  }
  if(errs && errs.length){
    html+='<div class="section-title" style="margin:14px 4px 6px">آخرین خطاها</div><div class="help-list">';
    errs.slice(0,10).forEach(function(e){
      html+='<div class="help-item"><b>'+escapeHtml(String(e.msg||'').slice(0,90))+'</b><span>نسخه '+escapeHtml(String(e.v||''))+' — '+escapeHtml(String(e.page||''))+'</span></div>';
    });
    html+='</div>';
  }
  html+='<div class="section-title" style="margin:14px 4px 6px">پیام همگانی (بنر بالای اپ همهٔ کاربران)</div>'
    +'<div class="field"><label>متن پیام (خالی = پاک‌کردن)</label><textarea id="bcMsg" rows="2" style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:inherit;padding:8px;font-family:inherit;font-size:12px">'+escapeHtml(bc&&bc.message?String(bc.message):'')+'</textarea></div>'
    +'<div class="modal-actions"><button class="btn primary" onclick="sendBroadcast()">انتشار پیام</button></div>'
    +(bc&&bc.message? '<div class="modal-actions"><button class="btn ghost" onclick="clearBroadcast()">پاک‌کردن پیام فعلی</button></div>' : '');
  html+='<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">بستن</button></div>';
  openModal(html);
}
function sendBroadcast(){
  var el=document.getElementById('bcMsg'); if(!el) return;
  var msg=el.value.trim();
  apiFetch('/api/admin/broadcast', {method:'POST', body: JSON.stringify({message:msg})}).then(function(res){
    if(res.ok && res.data && res.data.ok){ toast(msg?'پیام منتشر شد ✓':'پیام پاک شد ✓'); openAdminView(); }
    else toast((res.data&&res.data.error)||'انجام نشد — دسترسی ادمین فعال نیست');
  }).catch(function(){ toast('اتصال برقرار نشد'); });
}
function clearBroadcast(){ var el=document.getElementById('bcMsg'); if(el) el.value=''; sendBroadcast(); }

/* ---------- گارد state ورود گوگل (ضد CSRF — سمت سرور در آداون v2.7 اعتبارسنجی می‌شود) ---------- */
function makeOAuthState(){
  try{
    var arr=new Uint8Array(16);
    (window.crypto||window.msCrypto).getRandomValues(arr);
    var hex='';
    for(var i=0;i<arr.length;i++) hex+=('0'+arr[i].toString(16)).slice(-2);
    return hex;
  }catch(e){ return 'st'+Date.now()+Math.floor(Math.random()*1000000); }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
      // همیشه موقع باز شدن اپ، خودش چک کنه نسخه‌ی جدیدتری از Service Worker هست یا نه
      try{ reg.update(); }catch(e){}
    }).catch(function(){});
  });

  // وقتی نسخه‌ی جدید Service Worker کنترل صفحه رو به دست گرفت (یعنی آپدیت واقعاً جایگزین شد)،
  // صفحه رو یه‌بار خودکار رفرش کن تا کد جدید اجرا بشه - بدون نیاز به هیچ کار دستی از کاربر
  var swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
}
